<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FlowLab – offline automation workbench</title>
<style>
:root{--bg:#10141c;--pn:#171d29;--ln:#2a3447;--tx:#dde4f0;--mu:#8793a8;--ac:#3dd6b0;--tr:#f2b84b;--bd:#ff7a6b;color-scheme:dark}
@media(prefers-color-scheme:light){:root{--bg:#eef1f6;--pn:#fff;--ln:#cdd5e2;--tx:#1b2332;--mu:#5c6880;--ac:#0b9a79;--tr:#b87a06;--bd:#d6402f;color-scheme:light}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:14px/1.4 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--tx);display:grid;grid-template-rows:auto 1fr 230px}
header{display:flex;gap:8px;align-items:center;padding:8px 12px;background:var(--pn);border-bottom:1px solid var(--ln);flex-wrap:wrap}
h1{font:600 16px Georgia,serif;margin:0 10px 0 0}
button,select,input,textarea{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--ln);border-radius:6px;padding:5px 9px}
button{cursor:pointer}button:hover{border-color:var(--ac)}button.go{background:var(--ac);color:#06201a;border-color:var(--ac);font-weight:600}
:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
#gen{flex:1;min-width:220px}
main{display:grid;grid-template-columns:170px 1fr 270px;min-height:0}
aside{background:var(--pn);padding:10px;overflow:auto}#pal{border-right:1px solid var(--ln)}#ins{border-left:1px solid var(--ln)}
aside h3{font-size:12px;color:var(--mu);margin:12px 0 6px;font-weight:600}
.pi2{display:block;width:100%;text-align:left;margin-bottom:5px;border-left:4px solid var(--ac)}.pi2.t{border-left-color:var(--tr)}
#cv{overflow:auto;position:relative;background:radial-gradient(var(--ln) 1px,transparent 1px) 0 0/22px 22px}
#world{position:relative;width:2400px;height:1400px}svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
svg path{fill:none;stroke:var(--ac);stroke-width:2;pointer-events:stroke;cursor:pointer}svg path:hover{stroke:var(--bd)}
.nd{position:absolute;width:160px;height:46px;background:var(--pn);border:1px solid var(--ln);border-left:5px solid var(--ac);border-radius:8px;padding:5px 10px;cursor:grab;user-select:none}
.nd.t{border-left-color:var(--tr)}.nd.sel{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac)}.nd.ok{background:color-mix(in srgb,var(--ac) 18%,var(--pn))}.nd.er{background:color-mix(in srgb,var(--bd) 22%,var(--pn))}
.nd b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nd small{color:var(--mu);font-size:11px}
.pt{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--ac);cursor:crosshair}.pt.pi{left:-8px;top:17px;border-color:var(--mu)}.pt.po{right:-8px}
#ins label{display:block;font-size:12px;color:var(--mu);margin-top:9px}#ins input,#ins textarea,#ins select{width:100%;margin-top:3px}#ins textarea{min-height:90px;font:12px ui-monospace,Consolas,monospace}
footer{background:var(--pn);border-top:1px solid var(--ln);display:grid;grid-template-rows:auto 1fr;min-height:0}
.tabs{display:flex;gap:4px;padding:6px 10px}.tabs button.on{border-color:var(--ac);color:var(--ac)}
pre{margin:0;padding:6px 12px 12px;overflow:auto;font:12px/1.5 ui-monospace,Consolas,monospace;white-space:pre-wrap}
.hint{color:var(--mu);font-size:12px}
@media(max-width:800px){main{grid-template-columns:120px 1fr}#ins{display:none}}

#docs{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;grid-template-rows:auto 1fr}#docs.on{display:grid}
.dh{display:flex;gap:10px;align-items:center;padding:8px 14px;background:var(--pn);border-bottom:1px solid var(--ln);flex-wrap:wrap}.dh b{font:600 16px Georgia,serif}#dtabs{display:flex;gap:4px;flex:1;flex-wrap:wrap}#dtabs button.on{border-color:var(--ac);color:var(--ac)}
#dc{overflow:auto;padding:12px 24px 70px}#dc>div{max-width:880px;margin:0 auto;line-height:1.55}
#dc h2{font:600 20px Georgia,serif;margin:28px 0 6px;border-bottom:1px solid var(--ln);padding-bottom:4px}#dc h3{font-size:14px;margin:18px 0 4px}
#dc code{font:12.5px ui-monospace,Consolas,monospace;background:var(--pn);border:1px solid var(--ln);border-radius:4px;padding:0 4px}
#dc table{border-collapse:collapse;width:100%;margin:8px 0;font-size:13px}#dc th,#dc td{border:1px solid var(--ln);padding:5px 8px;text-align:left;vertical-align:top}#dc th{background:var(--pn)}
#dc pre{background:var(--pn);border:1px solid var(--ln);border-radius:6px;padding:8px 10px;overflow:auto;font:12px/1.5 ui-monospace,Consolas,monospace;white-space:pre}
.tg{border-left:4px solid var(--tr);background:var(--bg);padding:8px 10px;margin:10px 0;font-size:12px;line-height:1.5;border-radius:0 6px 6px 0}.tg code{font:11.5px ui-monospace,Consolas,monospace}
svg.lg{width:30px;height:30px;flex:none}
#abt{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:16px}#abt.on{display:flex}
#abt .box{background:var(--pn);border:1px solid var(--ln);border-radius:10px;max-width:640px;max-height:90vh;overflow:auto;padding:18px 22px;font-size:13px;line-height:1.55}
#abt .lgrow{display:flex;align-items:center;gap:10px;font:600 20px Georgia,serif;margin-bottom:8px}#abt p{margin:8px 0}
.note{border-left:4px solid var(--tr);background:var(--pn);padding:8px 12px;margin:10px 0;border-radius:0 6px 6px 0}
</style></head><body>
<header>
<svg class="lg" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#10141c"/><path d="M16 32C28 32 28 18 46 18M16 32C28 32 28 46 46 46" stroke="#3dd6b0" stroke-width="4" fill="none" stroke-linecap="round"/><circle cx="16" cy="32" r="7" fill="#f2b84b"/><circle cx="46" cy="18" r="6" fill="#3dd6b0"/><circle cx="46" cy="46" r="6" fill="#3dd6b0"/></svg><h1>FlowLab</h1><button id="docb">Docs</button><button id="abb">About</button>
<button class="go" id="run">Run workflow</button>
<select id="ex" title="Load a ready-made workflow"></select>
<input id="gen" placeholder='Describe it: "when form submitted, add tag lead, wait 1 day, send sms Hi {{ $json.name }}"'>
<button id="mk">Generate</button>
<button id="exj">Export JSON</button><button id="imj">Import JSON</button>
<button id="exc">Download compiled .js</button><button id="exn">Export n8n JSON</button><button id="clr">Clear</button>
</header>
<main>
<aside id="pal"></aside>
<div id="cv"><div id="world"><svg id="sv"></svg></div></div>
<aside id="ins"><span class="hint">Click a node to edit it. Drag from a right dot to a left dot to connect. Click a line to delete it. Delete key removes the selected node.</span></aside>
</main>
<footer>
<div class="tabs"><button data-t="log" class="on">Run log</button><button data-t="json">Workflow JSON</button><button data-t="code">Compiled code</button><button data-t="n8n">n8n JSON</button></div>
<pre id="out"></pre>
</footer>
<script>
/* ---------- 1. Node catalogue: type -> label, fields, defaults ---------- */
const T={
 manual:{n:'Manual start',t:1,f:[['data','Starting data (JSON)',1]],d:{data:'{"name":"Ada","email":"ada@example.com","phone":"+639171234567","score":72}'}},
 form:{n:'Form submitted (GHL)',t:1,f:[['data','Sample submission (JSON)',1]],d:{data:'{"name":"Ada","email":"ada@example.com","phone":"+639171234567","score":72}'}},
 webhook:{n:'Webhook (n8n)',t:1,f:[['data','Sample body (JSON)',1]],d:{data:'{"event":"order.paid","amount":120}'}},
 schedule:{n:'Schedule',t:1,f:[['data','Tick data (JSON)',1]],d:{data:'{"tick":1}'}},
 set:{n:'Set field',f:[['key','Field name'],['value','Value']],d:{key:'status',value:'new'}},
 if:{n:'IF',o:2,f:[['left','Value'],['op','Operator',0,['equals','contains','greater than','exists']],['right','Compare to']],d:{left:'{{ $json.score }}',op:'greater than',right:'50'}},
 code:{n:'Code (JS)',f:[['js','JavaScript – $json in, return an object',1]],d:{js:'return {...$json, upper: String($json.name).toUpperCase()};'}},
 wait:{n:'Wait',f:[['sec','Seconds (simulated)']],d:{sec:'60'}},
 sms:{n:'Send SMS',f:[['to','To'],['body','Message',1]],d:{to:'{{ $json.phone }}',body:'Hi {{ $json.name }}!'}},
 email:{n:'Send email',f:[['to','To'],['subj','Subject'],['body','Body',1]],d:{to:'{{ $json.email }}',subj:'Welcome',body:'Hi {{ $json.name }}, thanks for signing up.'}},
 tag:{n:'Add tag (GHL)',f:[['tag','Tag']],d:{tag:'new-lead'}},
 http:{n:'HTTP request',f:[['url','URL'],['method','Method',0,['GET','POST']]],d:{url:'https://api.github.com/zen',method:'GET'}},
 log:{n:'Log',f:[],d:{}}
};
const TG={
 code:['Runs your own JavaScript on the data coming in, for logic the other nodes cannot do (scoring, math, text, dates).','Read the incoming data with <code>$json</code>, then <code>return</code> an object. Copy the old fields with <code>{...$json}</code> and add new ones, e.g. <code>return {...$json, total: $json.price * 2};</code>. A mistake turns the node red and the log shows the error.','Not typed here. <code>$json</code> is the output of the previous node, and whatever you return becomes the next node\'s <code>$json</code>.'],
 manual:['Starts the workflow only when you press Run.','Edit the starting data (JSON), connect it to your first step, then press <b>Run workflow</b>.','From you. You type it in the data box above; nothing else supplies it.'],
 form:['Starts when someone submits a form. The data is what they typed.','Write a sample submission using your form\'s field names, connect your first step, and read values later with <code>{{ $json.name }}</code>.','In real life, from the form itself: every field the person filled in becomes a key (<code>name</code>, <code>email</code>, ...). Here it is the sample you typed, standing in for a real submission.'],
 webhook:['Starts when another app sends data to your flow\'s web address (a payment, booking or order).','Paste a sample of what the app sends as the body, connect your steps and press <b>Run workflow</b> to test. Real calls need the compiled script or n8n.','From the other app\'s request: it sends JSON in the body of its call. Here it is the sample you typed. Check that app\'s documentation for the exact shape.'],
 schedule:['Starts on a clock, such as every day at 9 AM. It carries no data of its own.','Connect a step that fetches the data (HTTP or Code), then act on it. Run simulates one tick; use cron or n8n for real timing.','Nowhere. A clock tick has no data, so this JSON is only a placeholder. Real data has to be fetched by a later step (HTTP or Code).']};
let S={nodes:[],edges:[]},sel=null,seq=1;
const $=s=>document.querySelector(s);

/* ---------- 2. Expressions: "{{ $json.name }}" ---------- */
const tpl=(s,j)=>String(s).replace(/\{\{(.+?)\}\}/g,(m,e)=>{try{return new Function('$json','return ('+e+')')(j)}catch(x){return ''}});
const cmp=(l,op,r)=>op=='equals'?String(l)==String(r):op=='contains'?String(l).includes(r):op=='exists'?l!==''&&l!=null:Number(l)>Number(r);

/* ---------- 3. Interpreter: runs the graph in the browser ---------- */
async function exec(n,j,log){
 const raw=n.p,p={};
 for(const k in raw)p[k]=(k=='js'||k=='data')?raw[k]:tpl(raw[k],j);
 const d=T[n.type];
 if(d.t)return[JSON.parse(raw.data||'{}')];
 switch(n.type){
  case'set':return[{...j,[p.key]:p.value}];
  case'if':{const r=cmp(p.left,p.op,p.right);log('  condition → '+r);return r?[j,null]:[null,j]}
  case'code':return[await new Function('$json','return (async()=>{'+raw.js+'})()')(j)];
  case'wait':log('  (simulated wait '+p.sec+'s)');return[j];
  case'sms':log('  SMS to '+p.to+': '+p.body);return[{...j,smsSent:true}];
  case'email':log('  EMAIL to '+p.to+' | '+p.subj+' | '+p.body);return[{...j,emailSent:true}];
  case'tag':return[{...j,tags:[...(j.tags||[]),p.tag]}];
  case'http':{const r=await fetch(p.url,{method:p.method});const t=await r.text();let x;try{x=JSON.parse(t)}catch{x=t}return[{...j,response:x}]}
  default:log('  '+JSON.stringify(j));return[j];
 }
}
async function run(){
 const log=[],L=m=>{log.push(m);$('#out').textContent=log.join('\n')};
 tab('log');document.querySelectorAll('.nd').forEach(e=>e.classList.remove('ok','er'));
 const start=S.nodes.find(n=>T[n.type].t);if(!start)return L('Add a trigger node first (amber).');
 async function walk(id,j,depth){
  if(depth>50)return L('Stopped: loop detected');
  const n=S.nodes.find(x=>x.id==id),el=document.getElementById(id);
  L('▶ '+T[n.type].n);
  try{const out=await exec(n,j,L);el.classList.add('ok');L('  data: '+JSON.stringify(out.find(o=>o!=null)));
   for(const e of S.edges)if(e.from==id&&out[e.port]!=null)await walk(e.to,out[e.port],depth+1)}
  catch(x){el.classList.add('er');L('  ERROR: '+x.message)}
 }
 await walk(start.id,{},0);L('✔ finished');
}

/* ---------- 4. Compiler: graph -> standalone Node.js script ---------- */
const q=s=>'`'+String(s).replace(/\\/g,'\\\\').replace(/`/g,'\\`').replace(/\{\{(.+?)\}\}/g,(m,e)=>'${'+e.replace(/\$json/g,'json')+'}')+'`';
function body(n){const p=n.p;switch(n.type){
 case'set':return`return [{...json, [${JSON.stringify(p.key)}]: ${q(p.value)}}];`;
 case'if':return`return cmp(${q(p.left)}, ${JSON.stringify(p.op)}, ${q(p.right)}) ? [json, null] : [null, json];`;
 case'code':return`const $json = json;\n  return [await (async () => {\n${p.js}\n  })()];`;
 case'wait':return`await new Promise(r => setTimeout(r, ${Number(p.sec)||0} * 1000));\n  return [json];`;
 case'sms':return`console.log('SMS to', ${q(p.to)}, ':', ${q(p.body)});\n  return [{...json, smsSent: true}];`;
 case'email':return`console.log('EMAIL to', ${q(p.to)}, '|', ${q(p.subj)}, '|', ${q(p.body)});\n  return [{...json, emailSent: true}];`;
 case'tag':return`return [{...json, tags: [...(json.tags || []), ${q(p.tag)}]}];`;
 case'http':return`const r = await fetch(${q(p.url)}, {method: ${JSON.stringify(p.method)}});\n  const t = await r.text(); let d; try { d = JSON.parse(t) } catch { d = t }\n  return [{...json, response: d}];`;
 case'log':return`console.log(JSON.stringify(json));\n  return [json];`;
 default:return`return [${p.data||'{}'}];`}}
function compile(){
 const trig=S.nodes.find(n=>T[n.type].t);
 let c=`// Generated by FlowLab. Run with: node workflow.js  (Node 18+)\nconst cmp = ${cmp.toString()};\n\n`;
 S.nodes.forEach(n=>c+=`// ${T[n.type].n}\nasync function ${n.id}(json) {\n  ${body(n)}\n}\n\n`);
 c+=`const fns = { ${S.nodes.map(n=>n.id).join(', ')} };\nconst edges = ${JSON.stringify(S.edges.map(e=>[e.from,e.port,e.to]))}; // [from, outputPort, to]\n\n`;
 c+=`async function walk(id, json) {\n  const out = await fns[id](json);\n  for (const [from, port, to] of edges)\n    if (from === id && out[port] != null) await walk(to, out[port]);\n}\n\nwalk(${JSON.stringify(trig?trig.id:'')}, {}).then(() => console.log('done'));\n`;
 return c;
}

/* ---------- 5. Generator: plain English -> nodes ---------- */
function gen(text){
 const parts=text.split(/\s*(?:,|->|=>|\bthen\b|\bafter that\b)\s*/i).map(s=>s.trim()).filter(Boolean);
 const out=[];const add=(type,p)=>out.push({type,p:{...T[type].d,...p}});
 for(const s0 of parts){const s=s0.toLowerCase();let m;
  if(/form|submit/.test(s)&&/when|on|new/.test(s))add('form',{});
  else if(/webhook/.test(s))add('webhook',{});
  else if(/schedule|every|daily|hourly/.test(s))add('schedule',{});
  else if(/manual|start/.test(s))add('manual',{});
  else if(m=s0.match(/\bif\s+(\w+)\s+(?:is\s+)?(>|greater than|equals|=|contains|exists)\s*(\S*)/i)){const o=m[2];add('if',{left:'{{ $json.'+m[1]+' }}',op:o=='>'||o=='greater than'?'greater than':o=='contains'?'contains':o=='exists'?'exists':'equals',right:m[3]})}
  else if(m=s0.match(/\btag\s+["']?([\w-]+)/i))add('tag',{tag:m[1]});
  else if(/wait|delay/.test(s)){m=s.match(/(\d+)\s*(sec|min|hour|day)/);const u={sec:1,min:60,hour:3600,day:86400};add('wait',{sec:m?String(m[1]*u[m[2]]):'60'})}
  else if(/sms|text/.test(s)){m=s0.match(/(?:sms|text)\s+(.+)/i);add('sms',{body:m?m[1].replace(/^["']|["']$/g,''):'Hi {{ $json.name }}!'})}
  else if(/email/.test(s)){m=s0.match(/email\s+(.+)/i);add('email',m?{body:m[1].replace(/^["']|["']$/g,'')}:{})}
  else if(m=s0.match(/https?:\/\/\S+/))add('http',{url:m[0]});
  else if(m=s0.match(/\bset\s+(\w+)\s+(?:to|=)\s+(.+)/i))add('set',{key:m[1],value:m[2]});
  else if(/code|script/.test(s))add('code',{});
  else if(/log/.test(s))add('log',{});}
 if(!out.length)return false;
 if(!T[out[0].type].t)out.unshift({type:'manual',p:{...T.manual.d}});
 S={nodes:[],edges:[]};seq=1;
 out.forEach((o,i)=>{const id='n'+seq++;S.nodes.push({id,type:o.type,p:o.p,x:30+(i%5)*190,y:40+Math.floor(i/5)*130+(i%2)*30});if(i)S.edges.push({from:'n'+i,port:0,to:id})});
 return true;
}

/* ---------- 6. UI: palette, canvas, inspector ---------- */
function palette(){let h='<h3>Triggers</h3>';
 for(const k in T)if(T[k].t)h+=`<button class="pi2 t" data-a="${k}">${T[k].n}</button>`;
 h+='<h3>Actions &amp; logic</h3>';
 for(const k in T)if(!T[k].t)h+=`<button class="pi2" data-a="${k}">${T[k].n}</button>`;
 $('#pal').innerHTML=h;
 $('#pal').onclick=e=>{const a=e.target.dataset.a;if(!a)return;const id='n'+seq++;S.nodes.push({id,type:a,p:{...T[a].d},x:60+(S.nodes.length%6)*30,y:60+(S.nodes.length%6)*30});sel=id;draw();inspect()}}
const H=n=>T[n.type].o?58:46;
function outPos(n,i){const o=T[n.type].o||1;return[n.x+160,n.y+(o==2?16+i*26:23)]}
function draw(){
 const w=$('#world');w.querySelectorAll('.nd').forEach(e=>e.remove());
 S.nodes.forEach(n=>{const d=T[n.type],e=document.createElement('div');
  e.className='nd'+(d.t?' t':'')+(sel==n.id?' sel':'');e.id=n.id;e.style.cssText=`left:${n.x}px;top:${n.y}px;height:${H(n)}px`;
  const sub=n.type=='if'?'true / false':(n.p.tag||n.p.key||n.p.url||n.p.sec&&n.p.sec+'s'||n.p.to||'');
  e.innerHTML=`<b>${d.n}</b><small>${String(sub).replace(/</g,'&lt;').slice(0,24)}</small>`+(d.t?'':'<i class="pt pi" data-in="1"></i>')+Array.from({length:d.o||1},(_,i)=>`<i class="pt po" data-p="${i}" style="top:${(d.o==2?10+i*26:17)}px"></i>`).join('');
  e.onmousedown=ev=>{if(ev.target.classList.contains('pt'))return;sel=n.id;const sx=ev.clientX-n.x,sy=ev.clientY-n.y;
   const mv=m=>{n.x=Math.max(0,m.clientX-sx);n.y=Math.max(0,m.clientY-sy);e.style.left=n.x+'px';e.style.top=n.y+'px';edges()};
   const up=()=>{removeEventListener('mousemove',mv);removeEventListener('mouseup',up);sync()};addEventListener('mousemove',mv);addEventListener('mouseup',up);
   document.querySelectorAll('.nd').forEach(x=>x.classList.toggle('sel',x.id==n.id));inspect()};
  w.appendChild(e)});
 edges();sync()}
function edges(){
 let h='';S.edges.forEach((e,i)=>{const a=S.nodes.find(n=>n.id==e.from),b=S.nodes.find(n=>n.id==e.to);if(!a||!b)return;
  const[x1,y1]=outPos(a,e.port),x2=b.x,y2=b.y+23,c=Math.max(40,Math.abs(x2-x1)/2);
  h+=`<path data-e="${i}" d="M${x1} ${y1}C${x1+c} ${y1} ${x2-c} ${y2} ${x2} ${y2}"><title>Click to delete</title></path>`});
 $('#sv').innerHTML=h;
 $('#sv').querySelectorAll('path').forEach(p=>p.onclick=()=>{S.edges.splice(p.dataset.e,1);draw()})}
$('#world').addEventListener('mousedown',ev=>{
 const po=ev.target.closest('.po');if(!po)return;ev.stopPropagation();
 const n=S.nodes.find(x=>x.id==po.parentNode.id),port=+po.dataset.p,wr=$('#world').getBoundingClientRect(),[x1,y1]=outPos(n,port);
 const tmp=document.createElementNS('http://www.w3.org/2000/svg','path');$('#sv').appendChild(tmp);
 const mv=m=>tmp.setAttribute('d',`M${x1} ${y1}L${m.clientX-wr.left} ${m.clientY-wr.top}`);
 const up=m=>{removeEventListener('mousemove',mv);removeEventListener('mouseup',up);tmp.remove();
  const t=document.elementFromPoint(m.clientX,m.clientY),nd=t&&t.closest('.nd');
  if(nd&&nd.id!=n.id&&!T[S.nodes.find(x=>x.id==nd.id).type].t&&!S.edges.some(e=>e.from==n.id&&e.port==port&&e.to==nd.id)){S.edges.push({from:n.id,port,to:nd.id});draw()}};
 addEventListener('mousemove',mv);addEventListener('mouseup',up)});
function inspect(){
 const n=S.nodes.find(x=>x.id==sel),el=$('#ins');if(!n){el.innerHTML='<span class="hint">Click a node to edit it.</span>';return}
 const d=T[n.type];let h=`<b>${d.n}</b> <span class="hint">(${n.id})</span><div class="hint">Use {{ $json.field }} to insert data. <code>$json</code> is the data arriving from the previous step.</div>`;
 if(TG[n.type])h+=`<div class="tg"><b>Definition</b><br>${TG[n.type][0]}<br><b>How to use it</b><br>${TG[n.type][1]}<br><b>Where this JSON comes from</b><br>${TG[n.type][2]}</div>`;

/* ---------- 9. n8n exporter: FlowLab graph -> n8n workflow JSON ---------- */
// In n8n: Workflows > top-right menu > Import from file (or paste the JSON onto the canvas).
const uid=()=>'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c=='x'?r:r&3|8).toString(16)});
const xp=s=>String(s).includes('{{')?'='+s:String(s);   // n8n expressions start with "="
function toN8n(){
 const notes=new Set(),used={},nm={},src={},nodes=[],conn={};
 const uniq=b=>{let k=b,i=2;while(used[k])k=b+' '+i++;used[k]=1;return k};
 S.nodes.forEach(n=>nm[n.id]=uniq(T[n.type].n.replace(/ \(.*\)/,'')));
 const N=(name,type,v,p,pos,x)=>nodes.push({parameters:p,id:uid(),name,type:'n8n-nodes-base.'+type,typeVersion:v,position:pos,...x});
 const link=(a,port,b)=>{const m=(conn[a]=conn[a]||{main:[]}).main;while(m.length<=port)m.push([]);m[port].push({node:b,type:'main',index:0})};
 S.nodes.forEach(n=>{
  const p=n.p,name=nm[n.id],pos=[Math.round(n.x*1.5),n.y],tpl2=t=>'`'+String(t).replace(/\{\{(.+?)\}\}/g,(m,e)=>'${'+e+'}')+'`';
  if(T[n.type].t){
   const k=n.type=='schedule'?['scheduleTrigger',1.2,{rule:{interval:[{field:'hours',hoursInterval:1}]}}]:n.type=='manual'?['manualTrigger',1,{}]:['webhook',2,{httpMethod:'POST',path:'flowlab-'+n.id,options:{}}];
   N(name,k[0],k[1],k[2],pos,k[0]=='webhook'?{webhookId:uid()}:{});
   const sn=uniq('Sample data '+n.id);N(sn,'code',2,{jsCode:'return [{json: '+(p.data||'{}')+'}];'},[pos[0]+150,pos[1]]);
   link(name,0,sn);src[n.id]=sn;
   notes.add('Each trigger is followed by a "Sample data" Code node so your {{ $json }} expressions work while testing. Delete it for production (real webhook data arrives under $json.body).');
   if(n.type=='form')notes.add('"Form submitted (GHL)" becomes a generic Webhook trigger; point your form tool at its URL.');
   return}
  switch(n.type){
   case'set':N(name,'set',3.4,{assignments:{assignments:[{id:uid(),name:p.key,value:xp(p.value),type:'string'}]},includeOtherFields:true,options:{}},pos);break;
   case'tag':N(name,'set',3.4,{assignments:{assignments:[{id:uid(),name:'tags',value:'={{ [...($json.tags || []), '+tpl2(p.tag)+'] }}',type:'array'}]},includeOtherFields:true,options:{}},pos);
    notes.add('"Add tag" has no n8n equivalent, so it appends to a "tags" field. Replace it with your CRM node (HighLevel, HubSpot, etc.).');break;
   case'if':{const op={'greater than':{type:'number',operation:'gt'},contains:{type:'string',operation:'contains'},exists:{type:'string',operation:'exists',singleValue:true},equals:{type:'string',operation:'equals'}}[p.op];
    N(name,'if',2.2,{conditions:{options:{caseSensitive:true,leftValue:'',typeValidation:'loose'},conditions:[{id:uid(),leftValue:xp(p.left),rightValue:xp(p.right),operator:op}],combinator:'and'},options:{}},pos);break}
   case'code':N(name,'code',2,{mode:'runOnceForEachItem',jsCode:'const result = await (async () => {\n'+p.js+'\n})();\nreturn { json: result };'},pos);break;
   case'wait':N(name,'wait',1.1,{resume:'timeInterval',amount:Number(p.sec)||0,unit:'seconds'},pos,{webhookId:uid()});break;
   case'sms':N(name,'twilio',1,{resource:'sms',operation:'send',from:'+10000000000',to:xp(p.to),message:xp(p.body)},pos);
    notes.add('SMS uses the Twilio node: add Twilio credentials and set the From number.');notes.add('Twilio and Send Email nodes output their own result, not your original data. Reference earlier data with $("Node name").item.json.');break;
   case'email':N(name,'emailSend',2.1,{fromEmail:'you@example.com',toEmail:xp(p.to||''),subject:xp(p.subj),text:xp(p.body),options:{}},pos);
    notes.add('Email uses the Send Email (SMTP) node: add SMTP credentials and a real From address.');notes.add('Twilio and Send Email nodes output their own result, not your original data. Reference earlier data with $("Node name").item.json.');break;
   case'http':N(name,'httpRequest',4.2,{method:p.method,url:xp(p.url),options:{}},pos);
    notes.add('HTTP Request puts the response fields directly on $json (FlowLab nests them under $json.response). Adjust Code nodes that read $json.response.');break;
   default:N(name,'noOp',1,{},pos)}
 });

 return{wf:{name:'FlowLab export',nodes,connections:conn,pinData:{},settings:{executionOrder:'v1'},active:false},notes:[...notes]};
}

guide:()=>`<div><h2>Quick start</h2>`+ol([
 'Pick a workflow from <b>Load an example…</b> or click nodes in the left palette to add them.',

<h2>How data flows</h2>
<p>A trigger starts the run with its sample data, one object such as <code>{"name":"Ada","score":72}</code>. Every node receives that object, may change it, and passes it on. A <b>Set field</b> node that writes <code>status</code> means every later node can read <code>{{ $json.status }}</code>. An <b>IF</b> node sends the object out of only one of its two outputs. A node with nothing connected after it ends that branch.</p>
<h2>Using the generator</h2>
<p>Type a sentence in the top box and press Enter. Steps are split on commas, "then", or "->". Recognised phrases: <code>when form submitted</code>, <code>webhook</code>, <code>every day</code>, <code>if score greater than 50</code>, <code>add tag hot-lead</code>, <code>wait 2 days</code>, <code>send sms Hello {{ $json.name }}</code>, <code>send email ...</code>, <code>set status to won</code>, a URL (HTTP request), <code>log</code>. The generator builds a straight chain (IF continues from its true output), so add false branches by hand.</p>
<h2>Suggested learning path</h2>`+ol([
 'Run all the examples. For each, change one value in the trigger data and run again to see another branch.',

 'Export to n8n, run <code>npx n8n</code> locally, import the file and fix what the notes list.',
 'Rebuild one flow by hand in a GoHighLevel trial account using the GHL tab as a map.'])+`
<div class="note"><b>Limits.</b> FlowLab passes one object at a time (n8n passes lists of items), SMS/email/wait are simulated, there are no credentials, and webhooks don't listen on a real URL.</div></div>`,

<p>A <b>trigger</b> is the event that starts a workflow. Every workflow needs one. A trigger has no input dot (nothing comes before it) and its output is the <b>starting data</b> that every later node can read through <code>{{ $json.field }}</code>. FlowLab has four triggers (amber nodes). Select one on the canvas and press <b>How to use this trigger</b> in the right panel to jump to its section here.</p>
<h2>Which trigger do I need?</h2>`+tb(['Situation','Trigger'],[

 ['Another app should tell my flow something happened (payment, call, order)','<a href="#t-webhook" data-j="t-webhook">Webhook</a>'],

<div class="note">In FlowLab, <b>Run workflow</b> always starts from the first trigger on the canvas and feeds it the sample data you typed. Nothing listens on a real URL or clock inside the editor; real listening and ticking are covered in each section below.</div>`+

<h3>Receive real webhooks offline (optional)</h3>
<p>Download the compiled script, then change two things: make your trigger function pass its input through, and replace the final <code>walk(...)</code> line with a small server. Replace <code>n1</code> with your trigger's id.</p>
<pre>async function n1(json) {
  return [json];            // was: return [{ ...sample data... }];
}
// delete the last line:  walk("n1", {}).then(...)
require("http").createServer((req, res) => {
  let b = "";
  req.on("data", c => b += c);
  req.on("end", async () => {
    await walk("n1", JSON.parse(b || "{}"));
    res.end("ok");
  });
}).listen(3000);</pre>
<p>Run <code>node workflow.js</code>, then in another terminal: <code>curl -X POST localhost:3000 -H "Content-Type: application/json" -d '{"name":"Ada","score":80}'</code> (the quotes differ on Windows PowerShell).</p>`+

n8n:()=>`<div><div class="note">n8n is updated often. Menu names and node versions here are a guide; confirm details in the official docs (docs.n8n.io).</div>
<h2>Core ideas</h2>
<p>An n8n <b>workflow</b> is nodes joined by connections. A <b>trigger</b> node starts it. Data moves as a <b>list of items</b>, each shaped <code>{ json: {...} }</code>, and most nodes run once <i>per item</i>. That is the biggest difference from FlowLab, which carries a single object. Each run is stored as an <b>execution</b> you can inspect afterwards.</p>
<h2>Expression cheat-sheet</h2>`+tb(['Goal','Expression'],[
 ['Field of the current item','<code>{{ $json.name }}</code>'],
 ['Webhook body field','<code>{{ $json.body.email }}</code>'],
 ['Data from an earlier node','<code>{{ $(\'Edit Fields\').item.json.name }}</code>'],
 ['All items from the previous node','<code>{{ $input.all() }}</code>'],
 ['Fallback value','<code>{{ $json.company || \'unknown\' }}</code>'],
 ['Math / any JavaScript','<code>{{ $json.price * 1.12 }}</code>'],
 ['Current date','<code>{{ $now.toFormat(\'yyyy-LL-dd\') }}</code>']])+`
<p>In an exported JSON file a value is an expression when the string starts with <code>=</code>, for example <code>"=Hi {{ $json.name }}"</code>. In the editor you switch a field to <i>Expression</i> mode.</p>
<h2>FlowLab nodes and their n8n equivalents</h2>`+tb(['FlowLab','n8n node','Notes'],[
 ['Manual start','Manual Trigger','Starts a test run from the editor.'],
 ['Form submitted / Webhook','Webhook','Has a <b>Test URL</b> (only while listening) and a <b>Production URL</b> (only when the workflow is active).'],
 ['Schedule','Schedule Trigger','Interval or cron expression.'],
 ['Set field','Edit Fields (Set)','Turn on "Include Other Input Fields" to keep existing data.'],
 ['IF','IF','Output 0 = true, output 1 = false. Use <b>Switch</b> for 3 or more paths.'],
 ['Code','Code','Choose "Run Once for Each Item" (return <code>{ json: {...} }</code>) or "All Items" (return a list).'],
 ['Wait','Wait','Pauses the execution, then resumes.'],
 ['Send SMS','Twilio','Needs credentials and a From number.'],
 ['Send email','Send Email','Needs SMTP credentials.'],
 ['Add tag','Your CRM node','For example HighLevel or HubSpot.'],
 ['HTTP request','HTTP Request','Response fields land directly on <code>$json</code>.'],
 ['Log','No Operation','Placeholder node; check the output in the editor.']])+`
<h2>Patterns you will meet</h2>
<ul><li><b>Webhook, IF, action:</b> receive an event, check a condition, act. The most common shape.</li>
<li><b>Merge:</b> use the Merge node when two branches must come back together and combine their data.</li>
<li><b>Looping:</b> use <b>Loop Over Items</b> (batches) when you must process a list in chunks or call an API with rate limits.</li>
<li><b>Retries:</b> in a node's Settings enable <b>Retry On Fail</b>. Enable <b>Continue On Fail</b> when one failure should not stop the run.</li>
<li><b>Error handling:</b> create a workflow starting with <b>Error Trigger</b> and select it as the Error Workflow in the main workflow's settings.</li>
<li><b>Reuse:</b> <b>Execute Workflow</b> calls another workflow like a function.</li></ul>
<h2>Testing and debugging</h2>
<ul><li><b>Execute Workflow</b> runs it once from the editor. Click any node to see its input and output.</li>
<li><b>Pin data</b> freezes a node's output so you can test later nodes without re-calling APIs.</li>
<li>Webhook test URLs only work while the editor is waiting; production URLs only work after you switch the workflow to <b>Active</b>.</li></ul>
<h2>Run n8n on your machine</h2>
<p>With Node.js installed: <code>npx n8n</code>, then open <code>http://localhost:5678</code>. With Docker: <code>docker run -it --rm -p 5678:5678 docker.n8n.io/n8nio/n8n</code>.</p>
<h2>Importing a FlowLab export</h2>`+ol(['Click <b>Export n8n JSON</b> in FlowLab.','In n8n open a new workflow, then use the top-right menu and choose <b>Import from file</b> (or paste the JSON onto the canvas).','Read the "Notes before importing" list in the <b>n8n JSON</b> tab and fix each item: add credentials, replace placeholders, delete the Sample data nodes.','Run with <b>Execute Workflow</b> and compare with FlowLab\'s log.'])+`
<h2>Common mistakes</h2>
<ul><li>Forgetting that nodes run per item, so a Code node written for one object may need "Run Once for Each Item".</li>
<li>Reading webhook data from <code>$json.name</code> instead of <code>$json.body.name</code>.</li>
<li>Testing a production webhook URL while the workflow is inactive.</li></ul></div>`,

ghl:()=>`<div><div class="note">GoHighLevel's menus, trigger names and plan features change often and differ by account. Treat this as a map and confirm each item in your account and the official help center (help.gohighlevel.com).</div>
<h2>Core ideas</h2>
<p>A GHL <b>workflow</b> (Automation, then Workflows) is built around a <b>contact</b>. One or more <b>triggers</b> enroll a contact, then <b>actions</b> run in order for that contact. Data is the contact's standard and custom fields, tags, opportunities and appointments, not free-form JSON as in n8n. A workflow only runs when it is set to <b>Published</b>; use the built-in test option with a test contact before publishing.</p>
<h2>FlowLab concepts and their GHL equivalents</h2>`+tb(['FlowLab','GHL (typical name)','Notes'],[
 ['Form submitted','Trigger: Form Submitted','Pick the form or survey. Fields map onto the contact.'],
 ['Webhook','Trigger: Inbound Webhook','Usually a premium trigger; check your plan.'],
 ['Schedule','Date-based triggers (e.g. Birthday Reminder, Custom Date Reminder)','GHL is event and contact driven, not cron driven.'],
 ['Set field','Action: Update Contact Field','The field must exist (create custom fields first).'],
 ['IF','Action: If/Else','Conditions test contact fields, tags, or other workflow data. Each branch has its own steps.'],
 ['Wait','Action: Wait','Wait a time span, until a date, or until an event happens.'],
 ['Send SMS','Action: Send SMS','Respect Do Not Disturb and opt-in rules.'],
 ['Send email','Action: Send Email','Pick or write a template.'],
 ['Add tag','Action: Add Tag','Tags are the usual way to trigger other workflows.'],
 ['HTTP request','Action: Custom Webhook','Usually a premium action.'],
 ['Code','Action: Custom Code','Usually a premium action.'],
 ['Log','Action: Add Note / Internal Notification','']])+`
<h2>Merge fields</h2>
<p>GHL inserts contact data with merge fields instead of <code>{{ $json.x }}</code>.</p>`+tb(['FlowLab','GHL merge field'],[
 ['<code>{{ $json.name }}</code>','<code>{{contact.first_name}}</code> or <code>{{contact.name}}</code>'],
 ['<code>{{ $json.email }}</code>','<code>{{contact.email}}</code>'],
 ['<code>{{ $json.phone }}</code>','<code>{{contact.phone}}</code>'],
 ['Today\'s date','<code>{{right_now.date}}</code>'],
 ['Custom field','The merge key shown for that field in Settings, Custom Fields']])+`
<h2>Rebuilding a FlowLab design in GHL</h2>`+ol([
 'Automation, Workflows, <b>Create Workflow</b>, start from scratch.',
 'Add the trigger that matches your first FlowLab node.',
 'Add each action in the same order. Replace <code>{{ $json.x }}</code> with merge fields.',
 'For an IF, add If/Else and build the condition from a contact field or tag. FlowLab\'s computed values (like <code>score</code>) must first be saved to a custom field with Update Contact Field.',
 'Test with a test contact, check the enrollment history, then switch to <b>Published</b>.'])+`
<h2>GHL versus n8n at a glance</h2>`+tb(['','n8n','GoHighLevel'],[
 ['Data model','Lists of JSON items','Contact fields, tags, opportunities'],
 ['Hosting','Self-host or cloud','Hosted SaaS only'],
 ['Code','Code node built in','Custom Code is usually a paid add-on'],
 ['Strength','Any API, any shape of data','Messaging, pipelines, calendars, funnels in one place'],
 ['Cost model','Free to self-host; pay for hosting','Subscription plus per-use charges for SMS, email and premium actions']])+`
<h2>Good habits</h2>
<ul><li>Add a Wait before follow-up messages and keep messages inside sensible sending hours.</li>
<li>Only message contacts who opted in, and honour opt-outs and Do Not Disturb. Check the rules for your country.</li>
<li>Use tags as hand-offs between workflows (for example <code>hot-lead</code> triggers a sales workflow).</li>
<li>Use a goal event or a stop condition so contacts who already booked do not receive the rest of a nurture sequence.</li></ul></div>`,

ref:()=>`<div><h2>Node reference</h2>`+tb(['Type','Name','Kind','Fields','Outputs'],Object.entries(T).map(([k,d])=>['<code>'+k+'</code>',d.n,d.t?'trigger':'action',d.f.map(f=>f[1]).join(', ')||'none',d.o||1]))+`
<h2>IF operators</h2>`+tb(['Operator','True when'],[['equals','text of both sides is identical'],['contains','left text includes the right text'],['greater than','left as a number is larger than right'],['exists','left is not empty']])+`
<h2>Expressions</h2>
<p><code>{{ ... }}</code> holds one JavaScript expression with <code>$json</code> in scope: <code>{{ $json.price * 2 }}</code>, <code>{{ $json.name.toUpperCase() }}</code>, <code>{{ $json.tags ? $json.tags.length : 0 }}</code>. If it throws, it becomes an empty string. Code nodes are not templated: write normal JavaScript, read <code>$json</code> and <code>return</code> an object.</p>
<h2>Files</h2>`+tb(['File','What it is'],[
 ['<code>workflow.json</code>','FlowLab\'s own format: <code>{nodes:[{id,type,p,x,y}], edges:[{from,port,to}]}</code>. <code>port</code> is the output index (IF: 0 true, 1 false).'],
 ['<code>workflow.js</code>','Compiled Node.js 18+ script: one async function per node, an <code>edges</code> list, and a <code>walk()</code> that follows it. Run with <code>node workflow.js</code>.'],
 ['<code>workflow-n8n.json</code>','n8n import file. See the n8n tab for caveats.']])+`
<h2>Keyboard and mouse</h2>`+tb(['Action','How'],[['Move a node','Drag it'],['Connect','Drag right dot to a left dot'],['Delete a line','Click it'],['Delete a node','Select it, press Delete (or use the button in the right panel)'],['Close docs','Esc']])+`
<h2>Examples index</h2>`+tb(['Example','What it teaches'],Object.keys(EX).map(k=>[k,EX[k].d.split(/\.\s/)[0].replace(/^Teaches:\s*/,'')]))+`
<h2>Glossary</h2>`+tb(['Term','Meaning'],[
 ['Trigger','The event that starts a workflow.'],['Action','A step that does something (send, tag, call).'],
 ['Item / object','The data passed between steps. One object in FlowLab, a list of items in n8n.'],
 ['Branch','A path chosen by an IF.'],['Merge field / expression','A placeholder replaced with real data when the step runs.'],
 ['Execution / run','One pass of a workflow from trigger to end.'],['Compile','Turn the visual graph into code that runs without the editor.'],
 ['Idempotent','Safe to run twice without double effects (for example, set a tag instead of adding a duplicate row).']])+`</div>`
};

function openDoc(k,a){dv.classList.add('on');showDoc(k,a)}
$('#dc').addEventListener('click',e=>{const j=e.target.dataset.j;if(j){e.preventDefault();showDoc('trig',j)}});
$('#dtabs').onclick=e=>{if(e.target.dataset.d)showDoc(e.target.dataset.d)};
$('#docb').onclick=()=>{dv.classList.add('on');showDoc('guide')};
$('#dx').onclick=()=>dv.classList.remove('on');
addEventListener('keydown',e=>{if(e.key=='Escape')dv.classList.remove('on')});
