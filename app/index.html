<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FlowLab – offline automation workbench</title>
<style>
:root{--bg:#10141c;--pn:#171d29;--ln:#2a3447;--tx:#dde4f0;--mu:#8793a8;--ac:#3dd6b0;--tr:#f2b84b;--bd:#ff7a6b;--lg:#a294ff;--sms:#3b82f6;color-scheme:dark}
@media(prefers-color-scheme:light){:root{--bg:#eef1f6;--pn:#fff;--ln:#cdd5e2;--tx:#1b2332;--mu:#5c6880;--ac:#0b9a79;--tr:#b87a06;--bd:#d6402f;--lg:#6a55d8;--sms:#2563eb;color-scheme:light}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:14px/1.4 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--tx);display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) 230px}
body.simon{grid-template-columns:minmax(0,1fr) 520px}
header{grid-column:1/-1;display:flex;gap:8px;align-items:center;padding:8px 12px;background:var(--pn);border-bottom:1px solid var(--ln);flex-wrap:wrap}
h1{font:600 16px Georgia,serif;margin:0 10px 0 0}
button,select,input,textarea{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--ln);border-radius:6px;padding:5px 9px}
button{cursor:pointer}button:hover{border-color:var(--ac)}button.go{background:var(--ac);color:#06201a;border-color:var(--ac);font-weight:600}
button[aria-pressed="true"]{border-color:var(--ac);color:var(--ac)}
:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
#gen{flex:1;min-width:220px}#ex{max-width:190px}
.menu{position:relative}.menu summary{list-style:none;cursor:pointer;border:1px solid var(--ln);border-radius:6px;padding:5px 12px;background:var(--bg);user-select:none}
.menu summary::-webkit-details-marker{display:none}.menu summary::after{content:" ▾";color:var(--mu)}.menu[open] summary,.menu summary:hover{border-color:var(--ac)}
.mbox{position:absolute;right:0;top:calc(100% + 4px);z-index:70;background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:4px;display:flex;flex-direction:column;min-width:210px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.mbox button{border:0;text-align:left;background:transparent;padding:7px 10px}.mbox button:hover{background:var(--bg)}.mbox hr{border:0;border-top:1px solid var(--ln);margin:4px 0;width:100%}
main{display:grid;grid-template-columns:170px 1fr 270px;min-height:0;position:relative}
body.simon main{grid-template-columns:150px 1fr 250px}
aside{background:var(--pn);padding:10px;overflow:auto;min-height:0}#pal{border-right:1px solid var(--ln)}#ins{border-left:1px solid var(--ln)}
aside h3{font-size:12px;color:var(--mu);margin:12px 0 6px;font-weight:600}
.pi2{display:block;width:100%;text-align:left;margin-bottom:5px;border-left:4px solid var(--ac)}.pi2.t{border-left-color:var(--tr)}.pi2.l{border-left-color:var(--lg)}
.cvw{position:relative;min-width:0;min-height:0}
#cv{position:absolute;inset:0;overflow:auto;background:radial-gradient(var(--ln) 1px,transparent 1px) 0 0/22px 22px}
#zw{position:relative;width:2400px;height:1400px}
#world{position:absolute;left:0;top:0;width:2400px;height:1400px;transform-origin:0 0}
#sv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
#sv path{fill:none;stroke:var(--ac);stroke-width:2;pointer-events:stroke;cursor:pointer;transition:opacity .3s}#sv path:hover{stroke:var(--bd)}
#sv path.hot{stroke-width:3.5}#sv path.cold{opacity:.22}
.zoom{position:absolute;left:10px;bottom:10px;display:flex;gap:2px;background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:2px;z-index:5}
.zoom button{border:0;padding:3px 9px;min-width:30px;font-size:12px}
.nd{position:absolute;width:160px;height:46px;background:var(--pn);border:1px solid var(--ln);border-left:5px solid var(--ac);border-radius:8px;padding:5px 10px;cursor:grab;user-select:none}
.nd.t{border-left-color:var(--tr)}.nd.l{border-left-color:var(--lg)}
.nd.sel{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac)}
.nd.ok{background:color-mix(in srgb,var(--ac) 18%,var(--pn))}.nd.er{background:color-mix(in srgb,var(--bd) 22%,var(--pn))}.nd.wn{background:color-mix(in srgb,var(--tr) 20%,var(--pn))}
.nd.ok::after,.nd.er::after,.nd.wn::after{position:absolute;top:-8px;right:-8px;width:18px;height:18px;border-radius:50%;font:700 11px/18px system-ui,sans-serif;text-align:center}
.nd.ok::after{content:"✓";background:var(--ac);color:#06201a}.nd.wn::after{content:"!";background:var(--tr);color:#2a1a00}.nd.er::after{content:"✕";background:var(--bd);color:#fff}
.nd.run{box-shadow:0 0 0 3px var(--tr);animation:pulse .9s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--tr) 25%,transparent)}}
.nd b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nd small{display:block;color:var(--mu);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pt{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--ac);cursor:crosshair}.pt.pi{left:-8px;top:17px;border-color:var(--mu)}.pt.po{right:-8px}
.pl{position:absolute;left:170px;font-size:10px;color:var(--mu);white-space:nowrap;pointer-events:none;max-width:110px;overflow:hidden;text-overflow:ellipsis}
#ins label{display:block;font-size:12px;color:var(--mu);margin-top:9px}#ins input,#ins textarea,#ins select{width:100%;margin-top:3px}#ins textarea{min-height:90px;font:12px ui-monospace,Consolas,monospace}
#ins input[type=checkbox]{width:auto;margin:0}
#ins label.chk{display:flex;gap:7px;align-items:flex-start;color:var(--tx)}#ins label.chk input{margin-top:2px}
.rule{border:1px solid var(--ln);border-radius:8px;padding:2px 6px 6px;margin-top:6px;position:relative;background:var(--bg)}
#ins .rule input,#ins .rule select{margin-top:4px;padding:4px 7px}
.rule .x{position:absolute;top:-9px;right:-7px;width:20px;height:20px;padding:0;border-radius:50%;line-height:16px;background:var(--pn)}
.comb{display:block;margin:6px auto 0;font-size:11px;font-weight:700;padding:1px 12px;border-radius:999px;color:var(--lg);border-color:var(--lg)}
.sm{font-size:12px;padding:3px 8px;margin-top:6px}
.route{border-left:3px solid var(--lg);padding:4px 0 8px 8px;margin-top:12px}
.rh{display:flex;gap:4px;align-items:center}#ins .rh input{flex:1;margin:0;font-weight:600}.rh button{padding:2px 7px}
.rn{font-size:11px;color:var(--mu);margin-top:2px}
details.lr{margin-top:14px;border-top:1px solid var(--ln);padding-top:8px}details.lr summary{cursor:pointer;font-size:12px;font-weight:600}
#ins pre{margin:3px 0 0;padding:6px 8px;background:var(--bg);border:1px solid var(--ln);border-radius:6px;max-height:170px;font-size:11px;white-space:pre-wrap;word-break:break-word}
.bad{color:var(--bd)}.wnt{color:var(--tr);font-size:12px;margin-top:4px}
footer{background:var(--pn);border-top:1px solid var(--ln);display:grid;grid-template-rows:auto 1fr;min-height:0}
.tabs{display:flex;gap:4px;padding:6px 10px}.tabs button.on{border-color:var(--ac);color:var(--ac)}
pre{margin:0;padding:6px 12px 12px;overflow:auto;font:12px/1.5 ui-monospace,Consolas,monospace;white-space:pre-wrap}
.hint{color:var(--mu);font-size:12px}
.hint code,.tg code{font:11.5px ui-monospace,Consolas,monospace}

/* ---------- Test panel ---------- */
#sim{display:none;grid-column:2;grid-row:2/4;padding:0;border-left:1px solid var(--ln);container-type:inline-size}
body.simon #sim{display:block}
.simh{position:sticky;top:0;z-index:3;display:flex;gap:8px;align-items:center;padding:8px 12px;background:var(--pn);border-bottom:1px solid var(--ln)}
.simh b{font:600 15px Georgia,serif}
.clk{margin-left:auto;font:12px ui-monospace,Consolas,monospace;color:var(--mu);white-space:nowrap}.clk b{font:inherit;color:var(--tx)}
.ff{font-size:11px;color:var(--tr);font-weight:600}
#simx{padding:2px 9px}
.sec{padding:10px 12px 4px}
#sim h4{margin:0 0 6px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);font-weight:600}
.formcard{background:#fff;color:#1b2332;border-radius:10px;padding:14px 16px;box-shadow:0 8px 24px rgba(0,0,0,.18);border:1px solid #dfe4ec}
.formcard h5{font:600 17px Georgia,serif;margin:0}.formcard .url{margin:0 0 6px;color:#8793a8;font-size:11px}
.formcard .fg{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}.formcard .fg .cbx{grid-column:1/-1}
@container (max-width:440px){.formcard .fg{grid-template-columns:1fr}}
.formcard label{display:block;font-size:12px;color:#3a465c;margin-top:7px;min-width:0}
.formcard input{width:100%;margin-top:3px;background:#fff;color:#1b2332;border:1px solid #cdd5e2;padding:5px 8px}
.formcard label.cbx{display:flex;gap:8px;align-items:center}.formcard label.cbx input{width:auto;margin:0}
.formcard .sub{margin-top:11px;width:100%;background:#0b9a79;border-color:#0b9a79;color:#fff;font-weight:600;padding:8px}
.formcard .sub.press{filter:brightness(.85);transform:scale(.98)}
.fnote{font-size:11px;color:#5c6880;margin-top:6px}.fnote a{color:#0b7a60}
.req{background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:8px 10px;font:12px/1.55 ui-monospace,Consolas,monospace;word-break:break-all}
.req .m{color:var(--tr);font-weight:700;margin-right:6px}.req .hd{color:var(--mu)}
.req textarea{width:100%;min-height:110px;font:12px ui-monospace,Consolas,monospace;margin-top:6px}
.req pre{padding:4px 0;max-height:140px}
.row{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}
.resp{font:12px ui-monospace,Consolas,monospace}.resp.ok{color:var(--ac)}.resp.bad{color:var(--bd)}
.req .hint{font-family:"Segoe UI",system-ui,sans-serif;margin-top:6px}
.duo{display:grid;grid-template-columns:226px 1fr;gap:12px;padding:10px 12px 4px}
@container (max-width:500px){.duo{grid-template-columns:1fr}.phone{margin:0 auto}}
.phone{width:226px;height:440px;border-radius:34px;background:#0b0e14;padding:9px;box-shadow:inset 0 0 0 2px #333c4e,0 10px 30px rgba(0,0,0,.3)}
.scr{height:100%;border-radius:26px;background:#f3f5f9;color:#111;display:flex;flex-direction:column;overflow:hidden;font-family:system-ui,"Segoe UI",sans-serif}
.sb{display:flex;justify-content:space-between;align-items:center;padding:9px 18px 3px;font:600 11px system-ui,sans-serif}
.bat{display:inline-block;width:18px;height:9px;border:1.5px solid #111;border-radius:3px;margin-left:4px;vertical-align:-1px;background:linear-gradient(90deg,#111 70%,transparent 0) 1px 1px/14px 4px no-repeat}
.ths{display:flex;gap:4px;overflow-x:auto;padding:4px 8px;border-bottom:1px solid #e1e5ec;flex:none}
.ths button{font-size:10px;padding:2px 8px;border-radius:999px;background:#fff;color:#111;border-color:#cdd5e2;white-space:nowrap}.ths button.on{background:#1b2332;color:#fff;border-color:#1b2332}
.thh{text-align:center;padding:4px 8px 6px;border-bottom:1px solid #e1e5ec;font-size:11px;flex:none}.thh b{display:block;font-size:12px}
.thh .av{width:30px;height:30px;border-radius:50%;margin:0 auto 2px;background:#8f9bb0;color:#fff;font:600 12px/30px system-ui,sans-serif}
.msgs{flex:1;overflow:auto;padding:8px;display:flex;flex-direction:column;gap:4px}
.ts{align-self:center;font-size:10px;color:#7d8798;margin:6px 0 2px}
.bub{align-self:flex-start;max-width:86%;background:#e3e6ed;color:#111;border-radius:16px 16px 16px 4px;padding:6px 10px;font-size:12px;line-height:1.35;white-space:pre-wrap;overflow-wrap:anywhere}
.bub u{color:#1d5fd0}
.dl{align-self:flex-start;font-size:9.5px;color:#7d8798;margin-left:4px}
.cmp{margin:6px 8px 10px;border:1px solid #cdd5e2;border-radius:999px;padding:5px 12px;font-size:11px;color:#9aa6b8;background:#fff;flex:none}
.empty{color:#7d8798;font-size:11.5px;text-align:center;margin:auto;padding:12px;line-height:1.5}
.new{animation:pop .3s ease-out}@keyframes pop{from{transform:scale(.9);opacity:0}}
.mail{border:1px solid var(--ln);border-radius:10px;background:var(--bg);display:flex;flex-direction:column;height:440px;overflow:hidden;min-width:0}
.mh{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--ln);font-weight:600;flex:none}.mh .n{margin-left:auto;font-size:11px;color:var(--mu);font-weight:400}.mh button{padding:2px 8px;font-size:12px;font-weight:400}
.mail .ths{border-color:var(--ln)}.mail .ths button{background:var(--pn);color:var(--tx);border-color:var(--ln)}.mail .ths button.on{background:var(--tx);color:var(--bg)}
.ml{flex:1;overflow:auto}
.mr{display:grid;grid-template-columns:28px 1fr auto;gap:1px 8px;padding:8px 10px;border-bottom:1px solid var(--ln);cursor:pointer}
.mr:hover,.mr:focus-visible{background:var(--pn)}
.mr .av{grid-row:span 4;width:28px;height:28px;border-radius:50%;background:var(--ac);color:#06201a;font:600 12px/28px system-ui,sans-serif;text-align:center}
.mr .f,.mr .s,.mr .p{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.mr .f{font-size:12px}.mr .t{font-size:10.5px;color:var(--mu)}.mr .s{grid-column:2/4;font-size:12px}.mr .p{grid-column:2/4;font-size:11px;color:var(--mu)}
.mr.unread .f,.mr.unread .s{font-weight:700}
.mr .to{grid-column:2/4;font-size:10.5px;color:var(--mu)}
.tagx{font-size:9.5px;border:1px solid var(--ln);border-radius:4px;padding:0 4px;margin-left:4px}
.mv{flex:1;overflow:auto;padding:10px 12px;font-size:12.5px}
.mv h5{font-size:15px;margin:2px 0 8px}.mv .meta{font-size:11.5px;color:var(--mu);line-height:1.6;border-bottom:1px solid var(--ln);padding-bottom:8px;margin-bottom:10px}.mv .meta b{color:var(--tx)}
.mv .body{white-space:pre-wrap;line-height:1.55;overflow-wrap:anywhere}.mv u{color:var(--ac)}
.crm{border:1px solid var(--ln);border-radius:10px;background:var(--bg);margin-bottom:14px}
.ch{display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--ln)}
.ch .av{width:38px;height:38px;border-radius:50%;background:var(--tr);color:#2a1a00;font:600 14px/38px system-ui,sans-serif;text-align:center;flex:none}
.ch .nm{font-weight:600}.ch .ci{font-size:11.5px;color:var(--mu);overflow-wrap:anywhere}
.dnd{margin-left:auto;font-size:10px;color:var(--bd);border:1px solid var(--bd);border-radius:4px;padding:1px 6px;white-space:nowrap}
.cgrid{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--ln)}
@container (max-width:440px){.cgrid{grid-template-columns:1fr}.cgrid .cb+.cb{border-left:0;border-top:1px solid var(--ln)}}
.cb{padding:8px 12px 10px;min-width:0}.cgrid .cb+.cb{border-left:1px solid var(--ln)}
#sim .cb h4{margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:11px;padding:1px 8px;border-radius:999px;background:color-mix(in srgb,var(--ac) 18%,transparent);border:1px solid color-mix(in srgb,var(--ac) 45%,transparent)}
.chip.gone{text-decoration:line-through;opacity:.55}
.kv{font-size:11.5px;display:grid;grid-template-columns:auto 1fr;gap:2px 10px}.kv span{overflow-wrap:anywhere}.kv span:nth-child(odd){color:var(--mu)}.kv .fresh{color:var(--ac);font-weight:600}
.act{list-style:none;margin:0;padding:0;font-size:11.5px;max-height:240px;overflow:auto}
.act li{display:grid;grid-template-columns:64px 58px 1fr;gap:6px;padding:4px 0;border-bottom:1px dashed var(--ln)}
.act .tm{color:var(--mu);font-size:10.5px;padding-top:1px}
.act .k{font:700 9px/1.6 system-ui,sans-serif;letter-spacing:.04em;text-align:center;border-radius:4px;align-self:start;background:var(--ln);color:var(--tx)}
.k.sms{background:var(--sms);color:#fff}.k.email{background:var(--ac);color:#06201a}.k.trig{background:var(--tr);color:#2a1a00}.k.if{background:var(--lg);color:#fff}
.k.err{background:var(--bd);color:#fff}.k.skip{background:transparent;border:1px solid var(--tr);color:var(--tr)}
@media(max-width:1280px){body.simon{grid-template-columns:minmax(0,1fr)}body.simon #sim{position:fixed;right:0;top:var(--hh,52px);bottom:0;width:min(520px,100%);z-index:30;box-shadow:-12px 0 30px rgba(0,0,0,.35)}}
@media(max-width:800px){main,body.simon main{grid-template-columns:120px 1fr}#ins{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

#docs{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;grid-template-rows:auto 1fr}#docs.on{display:grid}
.dh{display:flex;gap:10px;align-items:center;padding:8px 14px;background:var(--pn);border-bottom:1px solid var(--ln);flex-wrap:wrap}.dh b{font:600 16px Georgia,serif}#dtabs{display:flex;gap:4px;flex:1;flex-wrap:wrap}#dtabs button.on{border-color:var(--ac);color:var(--ac)}
#dc{overflow:auto;padding:12px 24px 70px}#dc>div{max-width:900px;margin:0 auto;line-height:1.55}
#dc h2{font:600 20px Georgia,serif;margin:28px 0 6px;border-bottom:1px solid var(--ln);padding-bottom:4px}#dc h3{font-size:14px;margin:18px 0 4px}
#dc code{font:12.5px ui-monospace,Consolas,monospace;background:var(--pn);border:1px solid var(--ln);border-radius:4px;padding:0 4px}
#dc table{border-collapse:collapse;width:100%;margin:8px 0;font-size:13px}#dc th,#dc td{border:1px solid var(--ln);padding:5px 8px;text-align:left;vertical-align:top}#dc th{background:var(--pn)}
#dc pre{background:var(--pn);border:1px solid var(--ln);border-radius:6px;padding:8px 10px;overflow:auto;font:12px/1.5 ui-monospace,Consolas,monospace;white-space:pre}
.tg{border-left:4px solid var(--tr);background:var(--bg);padding:8px 10px;margin:10px 0;font-size:12px;line-height:1.5;border-radius:0 6px 6px 0}
svg.lg{width:30px;height:30px;flex:none}
#abt{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:16px}#abt.on{display:flex}
#abt .box{background:var(--pn);border:1px solid var(--ln);border-radius:10px;max-width:640px;max-height:90vh;overflow:auto;padding:18px 22px;font-size:13px;line-height:1.55}
#abt .lgrow{display:flex;align-items:center;gap:10px;font:600 20px Georgia,serif;margin-bottom:8px}#abt p{margin:8px 0}
.note{border-left:4px solid var(--tr);background:var(--pn);padding:8px 12px;margin:10px 0;border-radius:0 6px 6px 0}
</style></head><body>
<header>
<svg class="lg" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#10141c"/><path d="M16 32C28 32 28 18 46 18M16 32C28 32 28 46 46 46" stroke="#3dd6b0" stroke-width="4" fill="none" stroke-linecap="round"/><circle cx="16" cy="32" r="7" fill="#f2b84b"/><circle cx="46" cy="18" r="6" fill="#3dd6b0"/><circle cx="46" cy="46" r="6" fill="#3dd6b0"/></svg><h1>FlowLab</h1><button id="docb">Docs</button><button id="abb">About</button>
<button class="go" id="run" title="Run with the trigger's sample data (Ctrl+Enter)">Run workflow</button>
<select id="spd" title="How fast the test run plays" aria-label="Run speed"><option value="normal">Normal</option><option value="slow">Slow</option><option value="instant">Instant</option></select>
<button id="simb" aria-pressed="false" title="Show the form, phone, inbox and contact record">Test panel</button>
<select id="ex" title="Load a ready-made workflow"></select>
<input id="gen" placeholder='Describe it: "when form submitted, if score greater than 50 and phone is not empty, add tag lead, wait 1 day, send sms Hi {{ $json.name }}"'>
<button id="mk">Generate</button>
<details class="menu" id="filem"><summary>File</summary><div class="mbox">
<button id="exj">Export JSON</button><button id="imj">Import JSON</button><button id="exc">Download compiled .js</button><button id="exn">Export n8n JSON</button><hr><button id="clr">Clear canvas</button></div></details>
</header>
<main>
<aside id="pal"></aside>
<div class="cvw"><div id="cv"><div id="zw"><div id="world"><svg id="sv"></svg></div></div></div>
<div class="zoom"><button id="zo" title="Zoom out" aria-label="Zoom out">−</button><button id="zr" title="Back to 100%">100%</button><button id="zi" title="Zoom in" aria-label="Zoom in">+</button><button id="zf" title="Fit the whole workflow">Fit</button></div></div>
<aside id="ins"></aside>
</main>
<footer>
<div class="tabs"><button data-t="log" class="on">Run log</button><button data-t="json">Workflow JSON</button><button data-t="code">Compiled code</button><button data-t="n8n">n8n JSON</button></div>
<pre id="out"></pre>
</footer>
<aside id="sim" aria-label="Test run"></aside>
<script>

const evalExpr=(e,j)=>new Function('$json','return ('+e+')')(j);
// Text with {{ }} inside -> a string. Missing values become '' and are reported in `miss`.
function tpl(s,j,miss){return String(s??'').replace(/\{\{(.+?)\}\}/g,(m,e)=>{let v;try{v=evalExpr(e,j)}catch(x){v=undefined}
 if(v==null||v===''){if(miss)miss.push(e.trim());return''}return typeof v=='object'?JSON.stringify(v):String(v)})}
// A value that is ONLY one {{ }} keeps its real type (number, list, true/false), the way n8n does.
const SOLO=/^\s*\{\{((?:(?!\}\}).)+)\}\}\s*$/;
function val(s,j,miss){const m=String(s??'').match(SOLO);if(!m)return tpl(s,j,miss);try{return evalExpr(m[1],j)}catch(x){return undefined}}

// One condition. Copies n8n's IF/Switch with "Convert types where required" turned on.
// l, r = left and right values, ic = ignore case, i = condition number (for error messages).
// This exact function is also copied into the compiled script.
function testRule(l, op, r, ic, i) {
  const fail = (v, type) => { throw new Error('Conversion error: the ' + typeof v + " '" + (typeof v == 'object' ? JSON.stringify(v) : v) + "' can't be converted to " + type + ' [condition ' + i + ']') };
  const has = v => v !== undefined && v !== null && !Number.isNaN(v);
  const str = v => v == null ? '' : typeof v == 'object' ? JSON.stringify(v) : String(v);
  const low = s => ic ? s.toLowerCase() : s;
  const num = v => { if (!has(v) || (typeof v == 'string' && !v.trim())) return null; const n = Number(v); if (typeof v == 'object' || Number.isNaN(n)) fail(v, 'a number'); return n };
  const date = v => { if (!has(v) || v === '') return null; const d = v instanceof Date ? v : new Date(typeof v == 'number' ? v : String(v).trim()); if (isNaN(d)) fail(v, 'a date'); return d.getTime() };
  const bool = v => { if (typeof v == 'boolean') return v; if (!has(v)) return undefined; const s = String(v).trim().toLowerCase(); if (s == 'true') return true; if (s == 'false') return false; if (s !== '' && Number(s) === 1) return true; if (s !== '' && Number(s) === 0) return false; return Boolean(v) };
  const list = v => { if (!has(v)) return []; if (Array.isArray(v)) return v; try { const a = JSON.parse(String(v)); if (Array.isArray(a)) return a } catch (e) {} fail(v, 'an array (list)') };
  const L = low(str(l)), R = low(str(r));
  switch (op) {
    case 'exists': return has(l);
    case 'nexists': return !has(l);
    case 'empty': return str(l).length === 0;
    case 'nempty': return str(l).length !== 0;
    case 'str_eq': return L === R;
    case 'str_ne': return L !== R;
    case 'str_has': return L.includes(R);
    case 'str_nhas': return !L.includes(R);
    case 'str_sw': return L.startsWith(R);
    case 'str_ew': return L.endsWith(R);
    case 'str_re': { const m = str(r).match(/^\/(.*)\/([gimsuy]*)$/); return (m ? new RegExp(m[1], m[2]) : new RegExp(str(r))).test(L) }
    case 'num_eq': case 'num_ne': case 'num_gt': case 'num_lt': case 'num_gte': case 'num_lte': {
      const a = num(l), b = num(r);
      if (a === null || b === null) return op == 'num_eq' ? a === b : op == 'num_ne' ? a !== b : false;
      return op == 'num_eq' ? a === b : op == 'num_ne' ? a !== b : op == 'num_gt' ? a > b : op == 'num_lt' ? a < b : op == 'num_gte' ? a >= b : a <= b }
    case 'date_after': case 'date_before': { const a = date(l), b = date(r); if (a === null || b === null) return false; return op == 'date_after' ? a > b : a < b }
    case 'bool_true': return bool(l) === true;
    case 'bool_false': return !bool(l);
    case 'arr_has': case 'arr_nhas': { const hit = list(l).some(x => ic && typeof x == 'string' && typeof r == 'string' ? x.toLowerCase() === r.toLowerCase() : x === r); return op == 'arr_has' ? hit : !hit }
    case 'arr_len_gt': return list(l).length > (num(r) ?? 0);
    case 'arr_empty': return list(l).length === 0;
    case 'arr_nempty': return list(l).length !== 0;
  }
  throw new Error('Unknown operator ' + op);
}

/* ---------- 4. Realistic sending rules (shared with the compiled script) ---------- */
function phoneErr(to) {
  const s = String(to ?? '').replace(/[\s().-]/g, '');
  if (!s) return "Invalid 'To' phone number: it is empty. Does the contact have a phone number?";
  if (!/^\+[1-9]\d{7,14}$/.test(s)) return "Invalid 'To' phone number '" + to + "'. Use international (E.164) format with country code, e.g. +639171234567";
  return '';
}
function emailErr(to) {
  const a = String(to ?? '').trim().replace(/^.*<(.+)>$/, '$1');
  if (!a) return 'Invalid recipient: the "To" address is empty. Does the contact have an email?';
  if (!/^[^\s@<>,]+@[^\s@<>,]+\.[^\s@<>,]+$/.test(a)) return 'Invalid recipient address "' + to + '"';
  return '';
}
// SMS are billed per segment: 160 plain characters (153 each when split), or 70 when the text
// needs Unicode, e.g. an emoji (67 each when split).
function segments(body) {
  const GSM = '@£$¥èéùìòÇ\nØø\rÅåΔ_ΦΓΛΩΠΨΣΘΞÆæßÉ !"#¤%&\'()*+,-./0123456789:;<=>?¡ABCDEFGHIJKLMNOPQRSTUVWXYZÄÖÑÜ§¿abcdefghijklmnopqrstuvwxyzäöñüà', EXT = '^{}\\[~]|€';
  let len = 0, uni = false;
  for (const ch of String(body)) { if (GSM.includes(ch)) len++; else if (EXT.includes(ch)) len += 2; else { uni = true; break } }
  if (uni) len = String(body).length;
  const n = uni ? (len <= 70 ? 1 : Math.ceil(len / 67)) : (len <= 160 ? 1 : Math.ceil(len / 153));
  return { n, len, uni };
}
// Form fields built from the sample data (used by the Test panel and by "node workflow.js --serve").
function formFields(sample) {
  const out = [];
  for (const [key, v] of Object.entries(sample || {})) {
    if (v && typeof v == 'object' && !Array.isArray(v)) continue;
    const label = key == 'dnd' ? 'Do not disturb (DND)' : key.replace(/_/g, ' ').replace(/([a-z])([A-Z])/g, '$1 $2').replace(/^./, c => c.toUpperCase()).replace(/\bsms\b/gi, 'SMS');
    const type = typeof v == 'boolean' ? 'checkbox' : typeof v == 'number' ? 'number' : /e-?mail/i.test(key) ? 'email' : /phone|mobile|tel/i.test(key) ? 'tel' : 'text';
    out.push({ key, label: Array.isArray(v) ? label + ' (comma separated)' : label, type, value: Array.isArray(v) ? v.join(', ') : v });
  }
  return out;
}
// Turns what was typed back into data with the same types as the sample.
function fromFields(sample, get) {
  const out = {};
  for (const [key, v] of Object.entries(sample || {})) {
    const x = get(key, typeof v == 'boolean' ? 'checkbox' : 'text');
    if (x === undefined || (v && typeof v == 'object' && !Array.isArray(v))) { out[key] = v; continue }
    if (typeof v == 'boolean') out[key] = x === true || x === 'on' || x === 'true';
    else if (typeof v == 'number') out[key] = String(x).trim() === '' ? '' : isNaN(Number(x)) ? String(x) : Number(x);
    else if (Array.isArray(v)) out[key] = String(x).split(',').map(s => s.trim()).filter(Boolean);
    else out[key] = String(x);
  }
  return out;
}
const isDnd=j=>j!=null&&(j.dnd===true||String(j.dnd).toLowerCase()==='true');
const listOf=v=>Array.isArray(v)?v:v==null||v===''?[]:[v];
function dur(s){const[n,u]=s&&s%86400==0?[s/86400,'day']:s&&s%3600==0?[s/3600,'hour']:s&&s%60==0?[s/60,'minute']:[s,'second'];return n+' '+u+(n==1?'':'s')}
const short=s=>{const m=String(s??'').match(SOLO);return m?m[1].trim().replace(/^\$json\./,''):String(s??'')};
const ruleText=g=>g.rules.map(r=>short(r.l)+' '+(OP[r.op]?OP[r.op].s:r.op)+(OP[r.op]&&OP[r.op].u?'':' '+r.r)).join(g.comb=='or'?' OR ':' AND ');
const fmtV=v=>v===undefined?'(missing)':typeof v=='string'?JSON.stringify(v):JSON.stringify(v);

/* ---------- 5. Interpreter: runs the graph in the browser ---------- */
// c = run context: log(), warn(), miss (empty template fields), my (run id)
function group(g,j,c,ic,label){
 const and=g.comb!='or';let res=and;
 if(!g.rules.length)c.warn((label||'')+'no conditions, so this is always '+and);
 c.log('  '+(label||'')+'checking '+g.rules.length+' condition'+(g.rules.length==1?'':'s')+(g.rules.length>1?' ('+(and?'AND: all must be true':'OR: one is enough')+')':''));
 g.rules.forEach((ru,i)=>{
  if(and?!res:res){c.log('    '+(i+1)+'. not checked: the answer is already '+res);return}
  const o=OP[ru.op];if(!o)throw new Error('Unknown operator '+ru.op);
  const l=val(ru.l,j),r=o.u?undefined:val(ru.r,j);
  const v=testRule(l,ru.op,r,ic,i);
  const rs=o.nt=='number'&&typeof r=='string'&&r.trim()!==''&&!isNaN(Number(r))?r:fmtV(r);
  c.log('    '+(i+1)+'. '+short(ru.l)+' = '+fmtV(l)+'  '+o.g.toLowerCase()+' '+o.label+(o.u?'':' '+rs)+'  →  '+v);
  const blank=l==null||l==='';
  if(blank&&/^(num|date)/.test(ru.op))c.warn(short(ru.l)+' is empty or missing, so "'+o.label+'" is false. Check the field name.');
  if(/^bool/.test(ru.op)&&typeof l=='string'&&!/^(true|false|1|0|)$/i.test(l.trim()))c.warn('"'+l+'" is not true/false. n8n counts any non-empty text as true, so "no" is true. Use Text → is equal to instead.');
  if(/^n?empty$/.test(ru.op)&&Array.isArray(l))c.warn(short(ru.l)+' is a list. As text, an empty list "[]" is not empty: use List / tags → is empty.');
  if(/^str_(eq|ne)$/.test(ru.op)&&!ic&&typeof l=='string'&&typeof r=='string'&&l!==r&&l.toLowerCase()===r.toLowerCase())c.warn('"'+l+'" and "'+r+'" differ only in letter case. Tick "Ignore case" if they should match.');
  res=v});
 return res}

async function exec(n,j,c){
 const p=n.p,t=s=>tpl(s,j,c.miss);
 switch(n.type){
  case'manual':case'form':case'webhook':case'schedule':return[j];
  case'set':{const k=t(p.key);if(!k)throw new Error('Field name is empty');const v=val(p.value,j,c.miss);c.act('set','Field '+k+' = '+(typeof v=='object'?JSON.stringify(v):v));return[{...j,[k]:v}]}
  case'if':{const ok=group(p,j,c,p.ic);c.log('  → takes the "'+(ok?'true':'false')+'" output');c.act('if','IF → '+ok+' ('+ruleText(p).slice(0,60)+')');return ok?[j,null]:[null,j]}
  case'switch':{const out=Array(outs(n)).fill(null),names=outNames(n);let hit=false;
   p.routes.forEach((rt,i)=>{if(hit&&!p.all){c.log('  Branch "'+names[i]+'": not checked (first match already found)');return}
    if(group(rt,j,c,p.ic,'Branch "'+names[i]+'": ')){out[i]=j;hit=true}});
   if(!hit&&p.fallback)out[p.routes.length]=j;
   const took=names.filter((_,i)=>out[i]!=null);
   c.log('  → '+(took.length?'goes to: '+took.join(', '):'no branch matched and there is no None branch, so the run ends here'));
   c.act('if','Switch → '+(took.join(' + ')||'no branch'));return out}
  case'code':{const r=await new Function('$json','return (async()=>{'+p.js+'})()')(j);
   if(!r||typeof r!='object'||Array.isArray(r))throw new Error('Code must return an object, for example: return {...$json, total: 5};');return[r]}
  case'wait':{const s=Math.max(0,(Number(p.amount)||0)*(UNIT[p.unit]||1));c.log('  waiting '+dur(s)+' (simulated: the clock jumps ahead)');await c.wait(s);return[j]}
  case'sms':{const to=t(p.to),from=t(p.from)||T.sms.d.from,body=t(p.body);
   if(isDnd(j)){c.warn('Skipped: the contact has Do Not Disturb on, so a real CRM would not send this SMS.');c.act('skip','SMS not sent: DND is on');return[j]}
   const e=phoneErr(to);if(e)throw new Error(e);if(!body.trim())throw new Error('Message body is empty');
   const sg=segments(body);c.log('  SMS from '+from+' to '+to+' · '+sg.n+' segment'+(sg.n>1?'s':'')+', '+sg.len+' chars'+(sg.uni?' (Unicode)':'')+'\n  "'+body+'"');
   c.sms({to,from,body,sg});return[{...j,smsSent:true}]}
  case'email':{const to=t(p.to),from=t(p.from)||T.email.d.from,subj=t(p.subj),body=t(p.body);
   if(isDnd(j)){c.warn('Skipped: the contact has Do Not Disturb on, so a real CRM would not send this email.');c.act('skip','Email not sent: DND is on');return[j]}
   const e=emailErr(to);if(e)throw new Error(e);if(!subj.trim())c.warn('The subject is empty. Many inboxes treat that as spam.');
   c.log('  EMAIL from '+from+' to '+to+'\n  subject: '+subj+'\n  '+body.replace(/\n/g,'\n  '));
   c.email({to,from,subj,body});return[{...j,emailSent:true}]}
  case'tag':case'untag':{const g=t(p.tag).trim(),had=listOf(j.tags);if(!g)throw new Error('Tag name is empty');
   if(n.type=='tag'){if(had.includes(g)){c.log('  contact already has "'+g+'" (no duplicate)');return[j]}c.tag(g,true);c.log('  tag added: '+g);return[{...j,tags:[...had,g]}]}
   if(!had.includes(g)){c.log('  contact did not have "'+g+'"');return[j]}c.tag(g,false);c.log('  tag removed: '+g);return[{...j,tags:had.filter(x=>x!==g)}]}
  case'http':{const url=t(p.url);c.log('  '+p.method+' '+url);const r=await fetch(url,{method:p.method});const tx=await r.text();let x;try{x=JSON.parse(tx)}catch{x=tx}
   c.log('  ← '+r.status+' '+r.statusText);c.act('http',p.method+' '+url.replace(/^https?:\/\//,'')+' → '+r.status);
   if(!r.ok)throw new Error('The server answered '+r.status+' '+r.statusText+'. n8n stops here too unless the node is set to continue on error.');return[{...j,response:x}]}
  default:c.log('  '+JSON.stringify(j));c.act('log','Logged the data');return[j];
 }
}

// Cron helpers (5 fields: minute hour day-of-month month day-of-week)
function cronText(c){const f=String(c||'').trim().split(/\s+/);if(f.length!=5)return'custom rule';const[mi,h,dom,mon,dow]=f,num=/^\d+$/;
 const hh=num.test(h)&&num.test(mi)?h.padStart(2,'0')+':'+mi.padStart(2,'0'):null,days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
 if(/^\*\/\d+$/.test(mi)&&h=='*'&&dom=='*'&&mon=='*'&&dow=='*')return'every '+mi.slice(2)+' minutes';
 if(num.test(mi)&&h=='*'&&dom=='*'&&mon=='*'&&dow=='*')return'every hour at :'+mi.padStart(2,'0');
 if(hh&&dom=='*'&&mon=='*'&&dow=='*')return'every day at '+hh;
 if(hh&&dom=='*'&&mon=='*'&&dow=='1-5')return'weekdays at '+hh;
 if(hh&&dom=='*'&&mon=='*'&&/^[0-7]$/.test(dow))return'every '+days[dow%7]+' at '+hh;
 if(hh&&num.test(dom)&&mon=='*'&&dow=='*')return'day '+dom+' of each month at '+hh;
 return'custom rule'}
function cronNext(c,from){const f=String(c||'').trim().split(/\s+/);if(f.length!=5)return null;
 const parse=(s,lo,hi)=>{const set=new Set();for(const part of s.split(',')){let[r,st]=part.split('/');st=st===undefined?1:+st;if(!(st>0))return null;let a=lo,b=hi;
  if(r!='*'){const ab=r.split('-').map(Number);a=ab[0];b=ab.length>1?ab[1]:(part.includes('/')?hi:a)}if(isNaN(a)||isNaN(b)||a<lo||b>hi)return null;for(let v=a;v<=b;v+=st)set.add(v)}return set};
 const M=parse(f[0],0,59),Hr=parse(f[1],0,23),D=parse(f[2],1,31),Mo=parse(f[3],1,12),W=parse(f[4],0,7);if(!M||!Hr||!D||!Mo||!W)return null;if(W.has(7))W.add(0);
 const both=f[2]!='*'&&f[4]!='*',d=new Date(from);d.setSeconds(0,0);d.setMinutes(d.getMinutes()+1);
 for(let i=0;i<200000;i++){
  const dayOk=both?(D.has(d.getDate())||W.has(d.getDay())):(D.has(d.getDate())&&W.has(d.getDay()));
  if(!Mo.has(d.getMonth()+1)||!dayOk){d.setDate(d.getDate()+1);d.setHours(0,0,0,0);continue}
  if(!Hr.has(d.getHours())){d.setHours(d.getHours()+1,0,0,0);continue}
  if(!M.has(d.getMinutes())){d.setMinutes(d.getMinutes()+1,0,0);continue}
  return d.getTime()}return null}

// Brings older or hand-edited workflow files up to date (FlowLab 1.0 IF nodes, Wait in seconds, missing fields).
function normalize(s){
 if(!s||!Array.isArray(s.nodes))throw new Error('not a FlowLab workflow');
 s.nodes=s.nodes.filter(n=>n&&T[n.type]);s.edges=Array.isArray(s.edges)?s.edges:[];
 for(const n of s.nodes){const p=n.p=n.p&&typeof n.p=='object'?n.p:{};
  if(n.type=='if'&&!Array.isArray(p.rules)){const m={equals:'str_eq',contains:'str_has','greater than':'num_gt',exists:'nempty'};p.rules=[{l:p.left??'',op:m[p.op]||'str_eq',r:p.right??''}];p.comb='and';delete p.left;delete p.op;delete p.right}
  if(n.type=='wait'&&p.sec!==undefined&&p.amount===undefined){const v=Number(p.sec)||0,u=v&&v%86400==0?'days':v&&v%3600==0?'hours':v&&v%60==0?'minutes':'seconds';p.amount=String(v/UNIT[u]);p.unit=u;delete p.sec}
  const d=clone(T[n.type].d);for(const k in d)if(p[k]===undefined)p[k]=d[k];
  if(T[n.type].c)(n.type=='if'?[p]:p.routes).forEach(g=>{g.rules=Array.isArray(g.rules)?g.rules:[];g.rules.forEach(r=>{if(!OP[r.op])r.op='str_eq'})});
  n.x=Math.max(0,+n.x||0);n.y=Math.max(0,+n.y||0)}
 s.edges=s.edges.filter(e=>{const a=s.nodes.find(n=>n.id==e.from),b=s.nodes.find(n=>n.id==e.to);return a&&b&&e.port>=0&&e.port<outs(a)});
 return s}

/* ---------- 12. n8n exporter: FlowLab graph -> n8n workflow JSON ---------- */
// In n8n: Workflows > top-right menu > Import from file (or paste the JSON onto the canvas).
const uid=()=>'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c=='x'?r:r&3|8).toString(16)});
const xp=s=>String(s??'').includes('{{')?'='+s:String(s??'');   // n8n expressions start with "="
function n8nCond(g,ic,notes){
 return{options:{caseSensitive:!ic,leftValue:'',typeValidation:'loose',version:2},combinator:g.comb=='or'?'or':'and',
  conditions:g.rules.map(r=>{const o=OP[r.op],op={type:o.nt,operation:o.no};if(o.u)op.singleValue=true;
   if(r.op=='arr_has'||r.op=='arr_nhas')op.rightType='any';if(r.op=='arr_len_gt')op.rightType='number';
   if(/^n?empty$/.test(r.op))notes.add('"is empty" / "is not empty" export as String checks. For lists such as tags, use the List / tags operators, which export as Array checks.');
   if(/^bool/.test(r.op))notes.add('Boolean checks: with "Convert types where required", n8n counts any non-empty text as true, so "no" is true.');
   let rv=o.u?'':xp(r.r);if((o.nt=='number'||r.op=='arr_len_gt')&&/^\s*-?\d+(\.\d+)?\s*$/.test(String(r.r)))rv=Number(r.r);
   return{id:uid(),leftValue:xp(r.l),rightValue:rv,operator:op}})}}
function toN8n(){
 const notes=new Set(),used={},nm={},src={},nodes=[],conn={};
 const uniq=b=>{let k=b,i=2;while(used[k])k=b+' '+i++;used[k]=1;return k};
 S.nodes.forEach(n=>nm[n.id]=uniq(T[n.type].n.replace(/ \(.*\)/,'')));
 const N=(name,type,v,p,pos,x)=>nodes.push({parameters:p,id:uid(),name,type:'n8n-nodes-base.'+type,typeVersion:v,position:pos,...x});
 const link=(a,port,b)=>{const m=(conn[a]=conn[a]||{main:[]}).main;while(m.length<=port)m.push([]);m[port].push({node:b,type:'main',index:0})};
 S.nodes.forEach(n=>{
  const p=n.p,name=nm[n.id],pos=[Math.round(n.x*1.5),n.y],tpl2=t=>'`'+String(t).replace(/\{\{(.+?)\}\}/g,(m,e)=>'${'+e+'}')+'`';
  if(T[n.type].t){
   const k=n.type=='schedule'?['scheduleTrigger',1.2,{rule:{interval:[{field:'cronExpression',expression:p.cron||'0 9 * * *'}]}}]:n.type=='manual'?['manualTrigger',1,{}]:['webhook',2,{httpMethod:'POST',path:p.path||'flowlab-'+n.id,options:{}}];
   N(name,k[0],k[1],k[2],pos,k[0]=='webhook'?{webhookId:uid()}:{});
   const sn=uniq('Sample data '+n.id);let js='{}';try{js=JSON.stringify(JSON.parse(p.data||'{}'),null,2)}catch(e){}N(sn,'code',2,{jsCode:'return [{json: '+js+'}];'},[pos[0]+150,pos[1]]);
   link(name,0,sn);src[n.id]=sn;
   notes.add('Each trigger is followed by a "Sample data" Code node so your {{ $json }} expressions work while testing. Delete it for production (real webhook data arrives under $json.body).');
   if(n.type=='form')notes.add('"Form submitted (GHL)" becomes a generic Webhook trigger; point your form tool at its URL, or use n8n\'s own Form Trigger.');
   return}
  switch(n.type){
   case'set':N(name,'set',3.4,{assignments:{assignments:[{id:uid(),name:p.key,value:xp(p.value),type:'string'}]},includeOtherFields:true,options:{}},pos);break;
   case'tag':N(name,'set',3.4,{assignments:{assignments:[{id:uid(),name:'tags',value:'={{ [...new Set([...($json.tags || []), '+tpl2(p.tag)+'])] }}',type:'array'}]},includeOtherFields:true,options:{}},pos);
    notes.add('"Add tag" / "Remove tag" have no n8n equivalent, so they change a "tags" field. Replace them with your CRM node (HighLevel, HubSpot, etc.).');break;
   case'untag':N(name,'set',3.4,{assignments:{assignments:[{id:uid(),name:'tags',value:'={{ ($json.tags || []).filter(t => t !== '+tpl2(p.tag)+') }}',type:'array'}]},includeOtherFields:true,options:{}},pos);
    notes.add('"Add tag" / "Remove tag" have no n8n equivalent, so they change a "tags" field. Replace them with your CRM node (HighLevel, HubSpot, etc.).');break;
   case'if':N(name,'if',2.2,{conditions:n8nCond(p,p.ic,notes),looseTypeValidation:true,options:{ignoreCase:!!p.ic}},pos);break;
   case'switch':N(name,'switch',3.2,{mode:'rules',rules:{values:p.routes.map((rt,i)=>({conditions:n8nCond(rt,p.ic,notes),renameOutput:true,outputKey:rt.name||'Branch '+(i+1)}))},looseTypeValidation:true,
     options:{fallbackOutput:p.fallback?'extra':'none',...(p.fallback?{renameFallbackOutput:'None'}:{}),ignoreCase:!!p.ic,allMatchingOutputs:!!p.all}},pos);
    notes.add('Switch exports as an n8n Switch in Rules mode with named outputs. The None branch is its extra Fallback Output.');break;
   case'code':N(name,'code',2,{mode:'runOnceForEachItem',jsCode:'const result = await (async () => {\n'+p.js+'\n})();\nreturn { json: result };'},pos);break;
   case'wait':N(name,'wait',1.1,{resume:'timeInterval',amount:Number(p.amount)||0,unit:p.unit||'seconds'},pos,{webhookId:uid()});break;
   case'sms':N(name,'twilio',1,{resource:'sms',operation:'send',from:p.from||'+10000000000',to:xp(p.to),message:xp(p.body)},pos);
    notes.add('SMS uses the Twilio node: add Twilio credentials and use a From number you own.');notes.add('Twilio and Send Email nodes output their own result, not your original data. Reference earlier data with $("Node name").item.json.');break;
   case'email':N(name,'emailSend',2.1,{fromEmail:p.from||'you@example.com',toEmail:xp(p.to||''),subject:xp(p.subj),emailFormat:'text',text:xp(p.body),options:{}},pos);
    notes.add('Email uses the Send Email (SMTP) node: add SMTP credentials and a real From address.');notes.add('Twilio and Send Email nodes output their own result, not your original data. Reference earlier data with $("Node name").item.json.');break;
   case'http':N(name,'httpRequest',4.2,{method:p.method,url:xp(p.url),options:{}},pos);
    notes.add('HTTP Request puts the response fields directly on $json (FlowLab nests them under $json.response). Adjust Code nodes that read $json.response.');break;
   default:N(name,'noOp',1,{},pos)}
 });
 S.edges.forEach(e=>link(src[e.from]||nm[e.from],e.port,nm[e.to]));
 if(S.nodes.some(n=>n.type=='sms'||n.type=='email'))notes.add('FlowLab skips SMS and email when the data has "dnd": true. n8n does not; add an IF on dnd (or use your CRM\'s DND setting) before sending.');
 return{wf:{name:'FlowLab export',nodes,connections:conn,pinData:{},settings:{executionOrder:'v1'},active:false},notes:[...notes]};
}
$('#exn').onclick=()=>save('workflow-n8n.json',JSON.stringify(toN8n().wf,null,2),'application/json');

<h2>The Test panel</h2>`+tb(['Part','What it shows'],[
 ['Form / request / schedule','What starts the run. A form trigger becomes a real form built from your sample fields: change the values and press <b>Submit</b>. A webhook shows the POST request with an editable body. A schedule shows its cron rule and the next real run time.'],

<p>The run copies real-world rules: SMS numbers need international format (<code>+63...</code>), empty recipients fail, contacts with <code>"dnd": true</code> are not messaged, HTTP errors stop the branch, and empty template fields are flagged. See <b>Conditions</b> for the full list.</p>
<h2>How data flows</h2>
<p>A trigger starts the run with its sample data, one object such as <code>{"name":"Ada","score":72}</code>. Every node receives that object, may change it, and passes it on. A <b>Set field</b> node that writes <code>status</code> means every later node can read <code>{{ $json.status }}</code>. An <b>IF</b> sends the object out of one of its two outputs; a <b>Switch</b> picks a branch. A node with nothing connected after it ends that branch.</p>
<h2>Using the generator</h2>
<p>Type a sentence in the top box and press Enter. Steps are split on commas, "then", or "->". Recognised phrases: <code>when form submitted</code>, <code>webhook</code>, <code>every day</code>, <code>if score greater than 50 and phone is not empty</code>, <code>if has tag customer</code>, <code>add tag hot-lead</code>, <code>remove tag nurture</code>, <code>wait 2 days</code>, <code>send sms Hello {{ $json.name }}</code>, <code>send email ...</code>, <code>set status to won</code>, a URL (HTTP request), <code>log</code>. The generator builds a straight chain (IF continues from its true output), so add false branches by hand.</p>
<h2>Suggested learning path</h2>`+ol([
 'Run all the examples. For each, change one value in the Test panel form or request and run again to see another branch.',
 'Read the <b>Conditions</b> tab, then load <i>Overdue invoice escalation</i> and flip "Send to every matching branch" to see how GHL and Zapier differ.',
 'Rebuild the lead qualification example from an empty canvas without looking.',
 'Read the <b>Compiled code</b> tab. Each node is one function, the edge list is a plain array, and <code>walk()</code> is the whole engine. Run it with <code>node workflow.js --fast</code>, then try <code>--serve</code>.',
 'Add a node type: put an entry in <code>T</code>, a <code>case</code> in <code>exec()</code> (runs in the browser), and a <code>case</code> in <code>body()</code> (generates code).',
 'Export to n8n, run <code>npx n8n</code> locally, import the file and fix what the notes list.',
 'Rebuild one flow by hand in a GoHighLevel trial account using the GHL tab as a map. Then read <b>Other tools</b>.'])+`
<div class="note"><b>Limits.</b> FlowLab passes one object at a time (n8n passes lists of items), SMS, email and waits are simulated, there are no credentials, and webhooks don't listen on a real URL inside the editor (the compiled script's <code>--serve</code> does).</div></div>`,

cond:()=>`<div><h2>How conditions work</h2>
<p>A condition takes a <b>value</b> (usually an expression like <code>{{ $json.score }}</code>), an <b>operator</b> and, for most operators, a value to compare to. Several conditions can be joined with <b>AND</b> (all must be true) or <b>OR</b> (one is enough). Click the AND/OR pill between two conditions to switch. FlowLab, n8n, GoHighLevel, Zapier and Make all work this way; only the labels differ.</p>
<p>FlowLab's condition engine copies n8n's IF and Switch nodes with <i>Convert types where required</i> turned on: the same operators, the same type conversions and the same error wording. The compiled script uses the exact same code.</p>
<h2>IF or Switch?</h2>`+tb(['','FlowLab IF','FlowLab Switch'],[
 ['Outputs','two: true and false','one per branch, plus an optional <b>None</b> branch'],
 ['n8n','IF node','Switch node in Rules mode; None = Fallback Output "Extra Output"'],
 ['GoHighLevel','If/Else with one branch; the other path is None','If/Else with several branches (up to 10 outcomes) and the None branch'],
 ['Zapier','Filter (go on or stop), or Paths','Paths, with an optional fallback path'],
 ['Make','A filter on a route','Router with a filter on each route and an optional fallback route']])+`
<h2>Which branch runs when several match?</h2>
<p>This is the difference that surprises people most when they change tools.</p>`+tb(['Tool','Rule'],[
 ['GoHighLevel If/Else','Branches are checked top to bottom and the contact takes the <b>first</b> branch that is true. If none is true, it takes <b>None</b>.'],
 ['n8n Switch','Only the <b>first</b> matching output, unless you turn on <i>Send data to all matching outputs</i>. Items that match nothing are dropped unless you set a Fallback Output.'],
 ['Zapier Paths','<b>Every</b> path whose rules are met runs. The fallback path runs only when no other path does.'],
 ['Make Router','Routes run one after another in the order you set, and data goes down <b>every</b> route whose filter passes. The fallback route takes what fits no other route.'],
 ['FlowLab Switch','First match, like GHL and n8n. Tick <b>Send to every matching branch</b> to behave like Zapier and Make.']])+`
<p>Try it: load <i>Overdue invoice escalation</i>. 20 days overdue matches both "over 14 days" and "over 7 days". With first-match only the final notice goes out; with every-match the client also gets the softer reminder. When you rely on first-match, put the strictest rule first.</p>
<h2>Operators</h2>
<p class="hint">GHL's operators depend on the field type and change over time. These names are confirmed in GHL's help center: Is / Is not, Includes / Does not include (tags and multi-choice fields), Is empty / Is not empty, Is after / Is before. Check the others in your account's If/Else editor.</p>`+tb(['FlowLab','n8n (type → operator)','GoHighLevel (closest)'],OPS.map(o=>['<b>'+o[2]+'</b> → '+o[1],N8T[o[4]]+' → '+N8L[o[5]],o[6]]))+`
<h2>Types matter</h2>
<ul><li><b>Text vs number.</b> Compared as text, <code>"9"</code> comes after <code>"10"</code>, because text is compared character by character. Use a Number operator for amounts, scores and counts. Number operators turn <code>"72"</code> into 72 for you, as n8n does.</li>
<li><b>Conversion errors.</b> A number check on text such as <code>"abc"</code> stops the run with <i>Conversion error: the string 'abc' can't be converted to a number</i>, the same wording n8n uses. Fix the data or pick another operator.</li>
<li><b>Empty values.</b> A number or date check on an empty or missing field is simply false. FlowLab warns you, because this is the most common silent bug.</li>
<li><b>exists vs is not empty.</b> A form that sends <code>"phone": ""</code> has a phone field that <i>exists</i> but <i>is empty</i>. To ask "can I text this person?", use <b>is not empty</b>.</li>
<li><b>True / false.</b> <code>true</code>, <code>"true"</code>, <code>1</code> and <code>"1"</code> count as true. n8n treats any other non-empty text as true too, so <code>"no"</code> is <i>true</i>. FlowLab copies this and warns you; for yes/no text use <b>Text → is equal to "yes"</b>.</li>
<li><b>Lists.</b> Tags are a list. Use the <b>List / tags</b> operators (<b>contains item</b> is GHL's <i>Includes</i>). Checked as text, an empty list <code>[]</code> is not empty.</li>
<li><b>Letter case.</b> Comparisons are case-sensitive unless you tick <b>Ignore case</b> (n8n's <i>Ignore Case</i> option). <code>"Pro"</code> is not <code>"pro"</code>.</li>
<li><b>One expression keeps its type.</b> A value that is only <code>{{ $json.tags }}</code> stays a list and <code>{{ $json.score }}</code> stays a number. Mixed with other text, such as <code>Score: {{ $json.score }}</code>, it becomes text.</li></ul>
<h2>Real-world failures the test run copies</h2>`+tb(['Situation','What real tools do','FlowLab'],[
 ['SMS to a number without a country code (09171234567)','The SMS provider rejects it','Red node: invalid \'To\' phone number'],
 ['Empty phone or email','The step fails; nothing is sent','Red node with the reason'],
 ['Contact has Do Not Disturb on (<code>"dnd": true</code>)','The CRM blocks the message','Step skipped (amber); the run continues'],
 ['A template uses a field that does not exist','The message goes out with a gap: "Hi ,"','Amber warning naming the empty field'],
 ['HTTP request answers 404 or 500','n8n stops with an error by default','Red node'],

 ['Adding a tag the contact already has','No duplicate','Logged, no duplicate']])+`
<p>When a node fails, FlowLab stops that branch. n8n stops the whole execution unless the node's <i>On Error</i> setting says to continue; each tool has its own error setting, so check it.</p></div>`,

tools:()=>`<div><h2>Will what I learn here work in other tools?</h2>
<p><b>The ideas, yes. The buttons and names, no.</b> Every automation tool is made of the same parts: an event starts the flow, data moves from step to step, conditions choose a path, waits spread steps out over time, and actions talk to the outside world. If you can design and debug a flow here, you can rebuild it in any of them. What changes is the vocabulary, where the data lives, and a few rules about branches and errors.</p>
<h2>The same idea in each tool</h2>`+tb(['Idea','FlowLab','n8n','GoHighLevel','Zapier','Make'],[
 ['Start','Trigger','Trigger node','Workflow trigger','Trigger (first step)','First module (trigger)'],
 ['Insert data','<code>{{ $json.name }}</code>','<code>{{ $json.name }}</code>','<code>{{contact.first_name}}</code>','Pick a field from an earlier step','Map a field from an earlier module'],
 ['Two-way decision','IF','IF','If/Else','Filter, or Paths','Filter'],
 ['Several branches','Switch','Switch','If/Else branches','Paths','Router'],
 ['When several match','first match (option: all)','first match (option: all)','first match','all that match','all that match'],
 ['Delay','Wait','Wait','Wait','Delay by Zapier','Sleep (short pauses)'],
 ['Your own logic','Code','Code','Custom Code (usually premium)','Code by Zapier','Built-in functions in mappings'],
 ['Call any API','HTTP request','HTTP Request','Custom Webhook (usually premium)','Webhooks by Zapier','HTTP module'],
 ['What moves between steps','one object','a list of items','the contact record','fields from earlier steps','bundles']])+`
<p class="hint">Microsoft Power Automate (Condition, Switch, Delay), HubSpot workflows (if/then branches, delays) and ActiveCampaign automations (If/Else, Wait) follow the same pattern.</p>
<h2>What carries over everywhere</h2>
<ul><li>Thinking in <b>trigger → conditions → actions</b>, and drawing the flow before building it.</li>
<li>Knowing where each value comes from, and testing with realistic sample data, including empty and odd values.</li>
<li>Condition logic: AND vs OR, branch order, types (text vs number), empty vs missing, letter case.</li>
<li>Timing: waits, drips, reminders before an event, and stopping a sequence when the goal is reached.</li>
<li>Reliability: duplicate events, steps that are safe to repeat, and what happens when a step fails.</li>
<li>Messaging rules: consent, opt-out text, Do Not Disturb, sensible sending hours.</li></ul>
<h2>What you will relearn in each tool</h2>
<ul><li>Where data lives: n8n passes lists of items (one run handles many), GHL works on one contact at a time, Zapier and Make map fields from numbered earlier steps.</li>
<li>Expression syntax: <code>{{ $json.x }}</code> in n8n, <code>{{contact.x}}</code> in GHL, picked or mapped fields in Zapier and Make.</li>
<li>Branch rules (first match or all matches) and error behaviour (stop, skip or continue).</li>
<li>Pricing and limits: tasks, operations, executions, premium actions, per-message SMS and email charges.</li>
<li>The exact names of triggers and actions, which change as the tools update.</li></ul>
<h2>Next steps</h2>`+ol(['Get comfortable here with the examples and the Test panel.','Export to n8n and run it there (<code>npx n8n</code>): the closest match to FlowLab.','Rebuild one flow in a GoHighLevel trial, replacing <code>{{ $json.x }}</code> with merge fields.','Rebuild the same flow on a free Zapier or Make plan and notice the branch rule difference.'])+`</div>`,

trig:()=>`<div><h2>What is a trigger?</h2>
<p>A <b>trigger</b> is the event that starts a workflow. Every workflow needs one. A trigger has no input dot (nothing comes before it) and its output is the <b>starting data</b> that every later node can read through <code>{{ $json.field }}</code>. FlowLab has four triggers (amber nodes). Select one on the canvas and press <b>Full guide</b> in the right panel to jump to its section here.</p>
<h2>Which trigger do I need?</h2>`+tb(['Situation','Trigger'],[
 ['I am learning or testing a flow with my own data','<a href="#t-manual" data-j="t-manual">Manual start</a>'],
 ['Someone fills in a form, survey or booking page','<a href="#t-form" data-j="t-form">Form submitted</a>'],
 ['Another app should tell my flow something happened (payment, call, order)','<a href="#t-webhook" data-j="t-webhook">Webhook</a>'],
 ['Something must happen on a clock (daily report, reminders, polling)','<a href="#t-schedule" data-j="t-schedule">Schedule</a>']])+`
<div class="note">In FlowLab, <b>Run workflow</b> always starts from the first trigger on the canvas and feeds it the sample data you typed. In the Test panel you can also submit the form, send the webhook request or fire a schedule tick with your own values. Nothing listens on a real URL or clock inside the editor; real listening and ticking are covered in each section below.</div>`+

 when:`you are learning, debugging one node, running a one-off job, or testing a branch with specific data.`,
 set:`<b>Starting data (JSON)</b>: the object the run begins with, for example <code>{"email":"ada@example.com"}</code>. Keys need double quotes.`,
 how:[`Add <b>Manual start</b> from the palette.`,`Type the starting data as valid JSON.`,`Connect its right dot to your first action.`,`Press <b>Run workflow</b>. Change the JSON and run again to test other cases.`],

 bad:[`Invalid JSON (single quotes, trailing commas) makes the run fail at the first node.`,`Expecting a manual trigger to run by itself: it never does.`]}) +
tsec('form','Form submitted (GHL)',{
 def:`Fires when a person submits a form or survey. The starting data is what they typed, one key per field.`,

 how:[`Add <b>Form submitted (GHL)</b>.`,`Write a sample submission with realistic values, including optional fields that are sometimes empty.`,`Connect an IF with <b>is not empty</b> on <code>{{ $json.phone }}</code> if later steps need a phone number.`,`Run it, then edit the form in the Test panel and press <b>Submit</b> to try other answers.`],
 ex:`<i>Lead qualification and routing</i> scores the submission, then sends hot leads a text within seconds.`,
 n8n:`Use a <b>Webhook</b> trigger and point your form tool at its URL (the FlowLab export does this), or n8n's own <b>Form Trigger</b>, which hosts a simple form for you. Form fields arrive under <code>$json.body</code> for webhooks.`,
 ghl:`Trigger <b>Form Submitted</b> (and the similar Survey Submitted). Choose the form, optionally filter by which form or page. Fields are saved to the contact, so later steps use merge fields like <code>{{contact.email}}</code>.`,

tsec('webhook','Webhook',{
 def:`A web address that another system calls (usually an HTTP POST with JSON) when something happens. The starting data is the request body.`,
 when:`an outside app can send events: a payment, an order, a booking, a missed call, a form tool, a support ticket.`,
 set:`<b>URL path</b> (optional) and <b>Sample body (JSON)</b>: what the other system would send, for example <code>{"event":"order.paid","amount":120}</code>.`,
 how:[`Add <b>Webhook (n8n)</b> and paste a real example payload from the sending app's documentation as the sample body.`,`Branch on <code>{{ $json.event }}</code> with an IF or Switch if the app sends several event types.`,`Run in FlowLab, or edit the request body in the Test panel and press <b>Send request</b>.`,`To receive <i>real</i> calls offline, use the compiled script with <code>--serve</code> (see below).`],
 ex:`<i>Paid order: totals and VIP treatment</i> receives an order, calculates tax and rewards big orders.`,
 n8n:`<b>Webhook</b> node. It shows a <b>Test URL</b> (works while the editor waits for a call) and a <b>Production URL</b> (works only when the workflow is <b>Active</b>). You choose the HTTP method and path. Body fields are under <code>$json.body</code>, query parameters under <code>$json.query</code>.`,

<h3>Receive real webhooks and form posts offline (optional)</h3>
<p>Click <b>Download compiled .js</b>, then start it in server mode:</p>
<pre>node workflow.js --serve 3000</pre>
<p>For a <b>Form submitted</b> trigger, open <code>http://localhost:3000</code> in your browser: you get a real form built from your sample fields, and submitting it runs the workflow. For any trigger you can send JSON from another terminal: <code>curl -X POST localhost:3000/webhook -H "Content-Type: application/json" -d '{"name":"Ada","score":80}'</code> (quotes differ in Windows PowerShell; you can also use <code>--data data.json</code> for a one-off run). The script answers <code>{"message":"Workflow was started"}</code> straight away, then runs the steps and prints every SMS and email in the terminal.</p>`+
tsec('schedule','Schedule',{
 def:`Starts on a clock: every N minutes, daily at 9 AM, weekdays only, and so on. It carries no data of its own, only the fact that it is time.`,
 when:`work should happen regularly: daily reports, reminder checks, birthday lookups, polling an API, cleaning up old records.`,
 set:`<b>Cron rule</b>, for example <code>0 9 * * *</code> (daily at 09:00), and <b>Tick data (JSON)</b>: a stand-in for the empty tick, for example <code>{"tick":1}</code>. Later nodes (HTTP request, Code) must fetch or create the real data.`,

<h3>Running a compiled workflow on a schedule</h3>`+tb(['System','Example (daily at 9:00)'],[
 ['Linux / macOS cron','<code>0 9 * * * node /path/to/workflow.js</code> (add with <code>crontab -e</code>)'],
 ['Windows','Task Scheduler: create a daily task running <code>node C:\\path\\workflow.js</code>']])+`
<h3>Cron cheat-sheet</h3>`+tb(['Pattern','Meaning'],[['<code>*/15 * * * *</code>','every 15 minutes'],['<code>0 * * * *</code>','every hour on the hour'],['<code>0 9 * * *</code>','every day at 09:00'],['<code>0 9 * * 1-5</code>','weekdays at 09:00'],['<code>0 0 1 * *</code>','midnight on the 1st of each month']])+`
<p>The five fields are minute, hour, day of month, month, day of week.</p>
<h2>Other triggers you will meet in n8n</h2>`+tb(['Trigger','Starts when','Typical use'],[
 ['Webhook','another system calls its URL','payments, forms, custom apps'],

 ['App triggers (Gmail, Telegram, GitHub, Google Sheets...)','something changes in that app','react to new rows, messages, issues'],

<p><b>Polling versus instant:</b> some app triggers check the app every few minutes (polling), others receive an instant webhook. Instant ones react faster; polling ones are easier to set up.</p>
<h2>Other triggers you will meet in GoHighLevel</h2>
<p class="hint">Names vary by account and version. Confirm in your workflow trigger list.</p>`+tb(['Trigger','Starts when','Typical use'],[
 ['Contact Created','a contact is added from any source','welcome message, tagging by source'],
 ['Contact Tag','a tag is added or removed','hand-offs between workflows'],
 ['Form Submitted / Survey Submitted','a form or survey is sent','lead capture and qualification'],
 ['Appointment status','a booking is created, confirmed, cancelled or marked no-show','reminders, no-show recovery'],
 ['Opportunity / pipeline stage changed','a deal moves or changes status','sales follow-up, win notices'],
 ['Customer Replied','the contact answers by SMS, email or chat','stop a sequence, alert a rep'],
 ['Call / missed call','a call ends or is missed','text-back'],
 ['Inbound Webhook','another system calls GHL','outside apps and payments (usually premium)'],

<p><b>How to use any trigger well:</b> add a filter so it only enrolls the right contacts, send a test event before publishing, and plan what happens if the same contact is enrolled twice.</p></div>`,

n8n:()=>`<div><div class="note">n8n is updated often. Menu names and node versions here are a guide; confirm details in the official docs (docs.n8n.io).</div>
<h2>Core ideas</h2>
<p>An n8n <b>workflow</b> is nodes joined by connections. A <b>trigger</b> node starts it. Data moves as a <b>list of items</b>, each shaped <code>{ json: {...} }</code>, and most nodes run once <i>per item</i>. That is the biggest difference from FlowLab, which carries a single object. Each run is stored as an <b>execution</b> you can inspect afterwards, much like clicking a node after a FlowLab test run.</p>
<h2>Expression cheat-sheet</h2>`+tb(['Goal','Expression'],[
 ['Field of the current item','<code>{{ $json.name }}</code>'],
 ['Webhook body field','<code>{{ $json.body.email }}</code>'],
 ['Data from an earlier node','<code>{{ $(\'Edit Fields\').item.json.name }}</code>'],
 ['All items from the previous node','<code>{{ $input.all() }}</code>'],
 ['Fallback value','<code>{{ $json.company || \'unknown\' }}</code>'],
 ['Math / any JavaScript','<code>{{ $json.price * 1.12 }}</code>'],
 ['Current date','<code>{{ $now.toFormat(\'yyyy-LL-dd\') }}</code>']])+`
<p>In an exported JSON file a value is an expression when the string starts with <code>=</code>, for example <code>"=Hi {{ $json.name }}"</code>. In the editor you switch a field to <i>Expression</i> mode.</p>
<h2>FlowLab nodes and their n8n equivalents</h2>`+tb(['FlowLab','n8n node','Notes'],[
 ['Manual start','Manual Trigger','Starts a test run from the editor.'],
 ['Form submitted / Webhook','Webhook','Has a <b>Test URL</b> (only while listening) and a <b>Production URL</b> (only when the workflow is active).'],
 ['Schedule','Schedule Trigger','Interval or cron expression.'],
 ['Set field','Edit Fields (Set)','Turn on "Include Other Input Fields" to keep existing data.'],
 ['IF','IF','Output 0 = true, output 1 = false. Several conditions joined by AND or OR; options <i>Ignore Case</i> and <i>Convert types where required</i>.'],
 ['Switch','Switch (Rules mode)','One routing rule per output; rename outputs; <i>Fallback Output</i> = FlowLab\'s None; <i>Send data to all matching outputs</i> = "every matching branch".'],
 ['Code','Code','Choose "Run Once for Each Item" (return <code>{ json: {...} }</code>) or "All Items" (return a list).'],
 ['Wait','Wait','Pauses the execution, then resumes.'],
 ['Send SMS','Twilio','Needs credentials and a From number.'],
 ['Send email','Send Email','Needs SMTP credentials. Set <i>Email Format</i> to Text for a plain body (the export does this).'],
 ['Add tag / Remove tag','Your CRM node','For example HighLevel or HubSpot.'],
 ['HTTP request','HTTP Request','Response fields land directly on <code>$json</code>.'],
 ['Log','No Operation','Placeholder node; check the output in the editor.']])+`
<h2>Patterns you will meet</h2>
<ul><li><b>Webhook, IF, action:</b> receive an event, check a condition, act. The most common shape.</li>
<li><b>Switch instead of chained IFs:</b> one node with named outputs is easier to read than IF inside IF.</li>
<li><b>Merge:</b> use the Merge node when two branches must come back together and combine their data.</li>
<li><b>Looping:</b> use <b>Loop Over Items</b> (batches) when you must process a list in chunks or call an API with rate limits.</li>
<li><b>Retries:</b> in a node's Settings enable <b>Retry On Fail</b>. Set <b>On Error</b> to continue when one failure should not stop the run.</li>
<li><b>Error handling:</b> create a workflow starting with <b>Error Trigger</b> and select it as the Error Workflow in the main workflow's settings.</li>
<li><b>Reuse:</b> <b>Execute Workflow</b> calls another workflow like a function.</li></ul>
<h2>Testing and debugging</h2>
<ul><li><b>Execute Workflow</b> runs it once from the editor. Click any node to see its input and output.</li>
<li><b>Pin data</b> freezes a node's output so you can test later nodes without re-calling APIs.</li>
<li>Webhook test URLs only work while the editor is waiting; production URLs only work after you switch the workflow to <b>Active</b>.</li></ul>
<h2>Run n8n on your machine</h2>
<p>With Node.js installed: <code>npx n8n</code>, then open <code>http://localhost:5678</code>. With Docker: <code>docker run -it --rm -p 5678:5678 docker.n8n.io/n8nio/n8n</code>.</p>
<h2>Importing a FlowLab export</h2>`+ol(['Click <b>Export n8n JSON</b> in FlowLab.','In n8n open a new workflow, then use the top-right menu and choose <b>Import from file</b> (or paste the JSON onto the canvas).','Read the "Notes before importing" list in the <b>n8n JSON</b> tab and fix each item: add credentials, replace placeholders, delete the Sample data nodes.','Run with <b>Execute Workflow</b> and compare with FlowLab\'s log.'])+`
<h2>Common mistakes</h2>
<ul><li>Forgetting that nodes run per item, so a Code node written for one object may need "Run Once for Each Item".</li>
<li>Reading webhook data from <code>$json.name</code> instead of <code>$json.body.name</code>.</li>
<li>Testing a production webhook URL while the workflow is inactive.</li>
<li>Comparing numbers with a String operator, or yes/no text with a Boolean operator.</li></ul></div>`,

ghl:()=>`<div><div class="note">GoHighLevel's menus, trigger names and plan features change often and differ by account. Treat this as a map and confirm each item in your account and the official help center (help.gohighlevel.com).</div>
<h2>Core ideas</h2>
<p>A GHL <b>workflow</b> (Automation, then Workflows) is built around a <b>contact</b>. One or more <b>triggers</b> enroll a contact, then <b>actions</b> run in order for that contact. Data is the contact's standard and custom fields, tags, opportunities and appointments, not free-form JSON as in n8n. FlowLab's <b>contact record</b> in the Test panel shows that view. A workflow only runs when it is set to <b>Published</b>; use the built-in test option with a test contact before publishing.</p>
<h2>FlowLab concepts and their GHL equivalents</h2>`+tb(['FlowLab','GHL (typical name)','Notes'],[
 ['Form submitted','Trigger: Form Submitted','Pick the form or survey. Fields map onto the contact.'],
 ['Webhook','Trigger: Inbound Webhook','Usually a premium trigger; check your plan.'],
 ['Schedule','Date-based triggers (e.g. Birthday Reminder, Custom Date Reminder)','GHL is event and contact driven, not cron driven.'],
 ['Set field','Action: Update Contact Field','The field must exist (create custom fields first).'],
 ['IF','Action: If/Else with one branch','The other path is the None branch. Conditions use contact fields, tags, time and other workflow data, grouped with AND / OR.'],
 ['Switch','Action: If/Else with several branches','Up to 10 outcomes. Checked top to bottom; the contact takes the first branch that is true, otherwise None.'],
 ['Wait','Action: Wait','Wait a time span, until a date, or until an event happens.'],
 ['Send SMS','Action: Send SMS','Respect Do Not Disturb and opt-in rules.'],
 ['Send email','Action: Send Email','Pick or write a template.'],
 ['Add tag / Remove tag','Action: Add Tag / Remove Tag','Tags are the usual way to trigger other workflows.'],
 ['HTTP request','Action: Custom Webhook','Usually a premium action.'],
 ['Code','Action: Custom Code','Usually a premium action.'],
 ['Log','Action: Add Note / Internal Notification','']])+`
<h2>Conditions in If/Else</h2>
<p>Confirmed operator names include <b>Is / Is not</b>, <b>Includes / Does not include</b> (tags and multi-choice fields), <b>Is empty / Is not empty</b> and <b>Is after / Is before</b> (dates and time). Others depend on the field type. FlowLab's <b>List / tags → contains item</b> is GHL's <i>Includes</i>; see the <b>Conditions</b> tab for the full map. One known trap: "Does not include" on two tags joined with AND is false if <i>either</i> tag is present.</p>
<h2>Merge fields</h2>
<p>GHL inserts contact data with merge fields instead of <code>{{ $json.x }}</code>.</p>`+tb(['FlowLab','GHL merge field'],[
 ['<code>{{ $json.name }}</code>','<code>{{contact.first_name}}</code> or <code>{{contact.name}}</code>'],
 ['<code>{{ $json.email }}</code>','<code>{{contact.email}}</code>'],
 ['<code>{{ $json.phone }}</code>','<code>{{contact.phone}}</code>'],
 ['Today\'s date','<code>{{right_now.date}}</code>'],
 ['Custom field','The merge key shown for that field in Settings, Custom Fields']])+`
<h2>Rebuilding a FlowLab design in GHL</h2>`+ol([
 'Automation, Workflows, <b>Create Workflow</b>, start from scratch.',
 'Add the trigger that matches your first FlowLab node.',
 'Add each action in the same order. Replace <code>{{ $json.x }}</code> with merge fields.',
 'For an IF or Switch, add If/Else and build each branch from contact fields or tags. FlowLab\'s computed values (like <code>score</code>) must first be saved to a custom field with Update Contact Field.',
 'Test with a test contact, check the enrollment history, then switch to <b>Published</b>.'])+`
<h2>GHL versus n8n at a glance</h2>`+tb(['','n8n','GoHighLevel'],[
 ['Data model','Lists of JSON items','Contact fields, tags, opportunities'],
 ['Hosting','Self-host or cloud','Hosted SaaS only'],
 ['Code','Code node built in','Custom Code is usually a paid add-on'],
 ['Strength','Any API, any shape of data','Messaging, pipelines, calendars, funnels in one place'],
 ['Cost model','Free to self-host; pay for hosting','Subscription plus per-use charges for SMS, email and premium actions']])+`
<h2>Good habits</h2>
<ul><li>Add a Wait before follow-up messages and keep messages inside sensible sending hours.</li>
<li>Only message contacts who opted in, and honour opt-outs and Do Not Disturb. Check the rules for your country.</li>
<li>Use tags as hand-offs between workflows (for example <code>hot-lead</code> triggers a sales workflow).</li>
<li>Use a goal event or a stop condition so contacts who already booked do not receive the rest of a nurture sequence.</li></ul></div>`,

ref:()=>`<div><h2>Node reference</h2>`+tb(['Type','Name','Kind','Settings','Outputs'],Object.entries(T).map(([k,d])=>['<code>'+k+'</code>',d.n,d.t?'trigger':d.g?'logic':'action',d.c?(k=='if'?'conditions (AND / OR), ignore case':'branches with conditions, None branch, every-match, ignore case'):d.f.map(f=>f[1]).join(', ')||'none',k=='if'?'2 (true, false)':k=='switch'?'one per branch + None':1]))+`
<h2>Condition operators</h2><p>See the <b>Conditions</b> tab for how they map to n8n and GoHighLevel.</p>`+tb(['Group','Operator','True when'],OPS.map(o=>[o[2],o[1],{str_eq:'the texts are identical',str_ne:'the texts differ',str_has:'the text includes the other text',str_nhas:'the text does not include it',str_sw:'the text begins with it',str_ew:'the text ends with it',str_re:'the regular expression matches (/pattern/flags also works)',num_eq:'the numbers are equal',num_ne:'the numbers differ',num_gt:'left is larger',num_lt:'left is smaller',num_gte:'left is larger or equal',num_lte:'left is smaller or equal',date_after:'the left date is later',date_before:'the left date is earlier',bool_true:'the value is true, "true" or 1',bool_false:'the value is false, missing, "false", 0 or empty',arr_has:'the list includes the item',arr_nhas:'the list does not include it',arr_len_gt:'the list has more items than the number',arr_empty:'the list has no items',arr_nempty:'the list has items',exists:'the field is present (even if it is "")',nexists:'the field is missing or null',empty:'the value is missing or ""',nempty:'the value has at least one character'}[o[0]]]))+`
<h2>Expressions</h2>
<p><code>{{ ... }}</code> holds one JavaScript expression with <code>$json</code> in scope: <code>{{ $json.price * 2 }}</code>, <code>{{ $json.name.toUpperCase() }}</code>, <code>{{ $json.tags ? $json.tags.length : 0 }}</code>. If it throws or is empty, it becomes an empty string and FlowLab warns you. A value that is only one <code>{{ }}</code> keeps its type in conditions and Set field. Code nodes are not templated: write normal JavaScript, read <code>$json</code> and <code>return</code> an object.</p>
<h2>Files</h2>`+tb(['File','What it is'],[
